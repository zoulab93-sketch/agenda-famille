      const names = e.participants.map(id=>{ const pr=profileById(id); return pr?pr.name:'?'; }).join(', ');
      row.style.background = stripeBg(cols);
      if (e.important) row.classList.add('imp');
      row.innerHTML = `${e.important?'<span class="imp-badge" aria-label="Important">★</span>':''}<div class="event-info"><div class="event-plate">
          <div class="event-title">${lnk(e)}${iconHtml(e)}${escapeHtml(e.title)}</div>
          <div class="event-meta">${e.start?e.start+(e.end?'–'+e.end:''):'Toute la journée'} · ${names}</div>
          ${e.lieu ? `<div class="event-meta">📍 ${escapeHtml(e.lieu)}</div>` : ''}
        </div></div>
        ${e.reminder ? `<span class="rem-badge">⏰ ${reminderLabel(e.reminder)}</span>` : ''}
        <button class="event-del" data-id="${e.id}" aria-label="Supprimer">🗑</button>`;
      row.querySelector('.event-info').onclick = ()=>openEventForm(e, ds);
      row.querySelector('.event-del').onclick = async ()=>{
        await removeEvent(e);
        render();
      };
      list.appendChild(row);
    });
    if (hiddenCount) {
      const note = document.createElement('div');
      note.className = 'empty-note';
      note.style.fontSize = '12.5px';
      note.style.padding = evs.length ? '6px 0 2px' : '0 0 8px';
      note.textContent = hiddenCount > 1
        ? `${hiddenCount} autres événements sont masqués par le filtre de la légende.`
        : `1 autre événement est masqué par le filtre de la légende.`;
      list.appendChild(note);
    }
    sheet.querySelector('#close-day').onclick = ()=>{ view.sheet=null; render(); };
    sheet.querySelector('#add-day-event').onclick = ()=>openEventForm(null, ds);
    scrim.appendChild(sheet);
    return scrim;
  }

  function openEventForm(event, dateStr, bulkDates, startTime){
    view.editingEvent = event ? {...event, participants:[...event.participants]} : {
      id: uid(), title:'', date: dateStr, start: startTime || '', end:'', icon:'', reminder: null, important: false, lieu:'',
      participants: state.activeId?[state.activeId]:[]
    };
    view._bulkDates = bulkDates || null;
    view._formFrom = view.sheet;
    view.sheet='form';
    render();
  }
  function closeForm(){
    view.sheet = (view._formFrom === 'day') ? 'day' : null;
    render();
  }
  function renderEventForm(){
    const scrim = document.createElement('div'); scrim.className='scrim center';
    scrim.onclick = (e)=>{ if(e.target===scrim){ closeForm(); } };
    const sheet = document.createElement('div'); sheet.className='sheet';
    const ev = view.editingEvent;
    const isNew = !state.events.some(x=>x.id===ev.id);
    const bulk = view._bulkDates;
    const linked = !bulk && !isNew && isLinked(ev);
    const srcLink = linked ? linkById(ev.sourceId) : null;
    sheet.innerHTML = `
      <div class="sheet-header"><h2>${bulk?`Nouvel événement (${bulk.length} jours)`:(isNew?'Nouvel événement':'Modifier')}</h2><button class="sheet-close" id="close-form">✕</button></div>
      ${bulk?`<div class="bulk-note">Cet événement sera appliqué aux ${bulk.length} jours sélectionnés.</div>`:''}
      <div class="preset-row" id="presets"></div>
      <div class="form-row"><label>Titre</label><input type="text" id="f-title" value="${escapeAttr(ev.title)}"></div>
      <div class="form-row"><label>Icône</label><div style="display:flex; gap:8px; align-items:flex-start;"><div class="chips" id="f-icons" style="flex:1; min-width:0;"></div><div id="f-lieu" style="min-width:0;"></div><div id="f-imp"></div></div></div>
      ${bulk?'':`<div class="form-row"><label>Date</label><input type="date" id="f-date" value="${ev.date}"></div>`}
      <div class="form-row time-row">
        <div style="flex:1"><label>Début</label><button type="button" class="time-field" id="f-start-btn">${ev.start||'--:--'}</button></div>
        <div style="flex:1"><label>Fin</label><button type="button" class="time-field" id="f-end-btn">${ev.end||'--:--'}</button></div>
      </div>
      <div class="form-row"><label>⏰ Rappel</label><div class="chips" id="f-reminder"></div><div id="f-reminder-note" class="reminder-note"></div></div>
      <div class="form-row"><label>Qui participe ?</label><div class="chips" id="f-participants"></div></div>
      <button class="save-btn" id="f-save">Enregistrer</button>
    `;
    if (linked) {
      // Événement d'un agenda lié : titre, date et heures suivent la source
      const note = document.createElement('div'); note.className = 'bulk-note';
      note.innerHTML = `${LINK_SVG}Vient de « <b>${escapeHtml(srcLink ? srcLink.nom : 'agenda lié')}</b> ». Le titre, la date et les heures suivent le lien ; le reste peut se régler ici.`;
      sheet.querySelector('.sheet-header').after(note);
      sheet.querySelector('#presets').style.display = 'none';
      ['#f-title', '#f-date', '#f-start-btn', '#f-end-btn'].forEach(sel=>{
        const el = sheet.querySelector(sel);
        if (el) { el.disabled = true; el.classList.add('field-locked'); }
      });
    }
    const iconWrap = sheet.querySelector('#f-icons');
    let iconsOpen = false;
    function chipBtn(text, on, onClick, big){
      const b = document.createElement('button'); b.type='button';
      b.className='chip'+(on?' on':'');
      b.style.background = on?'var(--ink)':'var(--surface)';
      b.style.borderColor = on?'var(--ink)':'var(--line)';
      if (big) b.style.fontSize='16px';
      b.textContent = text;
      b.onclick = onClick;
      return b;
    }
    // Bouton « replié » (Icône, Rappel) : discret, aux couleurs du formulaire
    function softChip(b){
      b.classList.remove('on');
      b.style.background = 'var(--surface-soft)';
      b.style.borderColor = 'var(--line)';
      b.style.color = 'var(--ink)';
      return b;
    }
    const impWrap = sheet.querySelector('#f-imp');
    function drawImportant(){
      impWrap.innerHTML = '';
      const on = !!ev.important;
      const b = chipBtn('', on, ()=>{ ev.important = !ev.important; drawImportant(); });
      b.innerHTML = on ? '<span style="color:#F2C14E">★</span> Important' : '☆ Important';
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      impWrap.appendChild(b);
    }
    const lieuWrap = sheet.querySelector('#f-lieu');
    function drawLieu(){
      lieuWrap.innerHTML = '';
      const val = (ev.lieu || '').trim();
      const b = chipBtn('📍 ' + (val || 'Lieu'), false, ()=>{
        openTextPrompt('Lieu', val, (txt)=>{ ev.lieu = txt; drawLieu(); });
      });
      b.title = val || 'Ajouter un lieu';
      if (val) { b.style.fontWeight = '700'; }
      // Événement d'un agenda lié : le lieu suit la source
      if (linked) { b.disabled = true; b.classList.add('field-locked'); }
      lieuWrap.appendChild(b);
    }
    function drawIcons(){
      iconWrap.innerHTML='';
      iconWrap.classList.remove('icon-grid');
      impWrap.style.display = iconsOpen ? 'none' : '';
      lieuWrap.style.display = iconsOpen ? 'none' : '';
      iconWrap.style.flex = iconsOpen ? '1' : '0 0 auto';
      if (!iconsOpen) {
        const closed = chipBtn((ev.icon || '∅') + '  ▾', true, ()=>{ iconsOpen = true; drawIcons(); }, true);
        if (ev.icon && DOT_COLORS[ev.icon]) { const tIn = sheet.querySelector('#f-title'); closed.innerHTML = iconHtml({ icon: ev.icon, title: tIn ? tIn.value : ev.title }) + ' ▾'; }
        iconWrap.appendChild(softChip(closed));
        return;
      }
      // 1.3.10 : une icône retirée de la liste reste proposée (en bout de liste) pour l'événement qui l'a
      const evIcons = (ev.icon && !ICON_CHOICES.includes(ev.icon) && !DOT_COLORS[ev.icon]) ? ICON_CHOICES.concat([ev.icon]) : ICON_CHOICES;
      iconWrap.classList.add('icon-grid');
      evIcons.forEach(ic=>{
        const on = (ev.icon||'')===ic;
        const b = chipBtn(ic || '∅', on, ()=>{ ev.icon = ic; iconsOpen = false; drawIcons(); }, true);
        b.classList.add('icon-chip');
        iconWrap.appendChild(b);
      });
    }
    drawImportant();
    drawLieu();
    drawIcons();
    { const tIn = sheet.querySelector('#f-title'); if (tIn) tIn.addEventListener('input', ()=>{ if (!iconsOpen) drawIcons(); }); }
    const presetsWrap = sheet.querySelector('#presets');
    SHIFT_PRESETS.forEach(name=>{
      const b = document.createElement('button'); b.className='preset'; b.textContent=name;
      b.onclick = ()=>{
        sheet.querySelector('#f-title').value = name;
        ev.icon = PRESET_ICON[name]||'';
        drawIcons();
        const t = PRESET_TIME[name];
        if (t) {
          ev.start = t.start; ev.end = t.end;
          sheet.querySelector('#f-start-btn').textContent = ev.start || '--:--';
          sheet.querySelector('#f-end-btn').textContent = ev.end || '--:--';
        }
      };
      presetsWrap.appendChild(b);
    });
    const remWrap = sheet.querySelector('#f-reminder');
    const remNote = sheet.querySelector('#f-reminder-note');
    let remOpen = false;
    function drawReminders(){
      remWrap.innerHTML = '';
      const cur = ev.reminder ?? null;
      const isCustom = cur !== null && !REMINDER_CHOICES.some(r=>r.min===cur);
      if (!remOpen) {
        const lab = cur === null ? 'Aucun' : reminderLabel(cur);
        remWrap.appendChild(softChip(chipBtn(lab + '  ▾', true, ()=>{ remOpen = true; drawReminders(); })));
      } else {
        REMINDER_CHOICES.forEach(r=>{
          remWrap.appendChild(chipBtn(r.label, cur === r.min, ()=>{ ev.reminder = r.min; remOpen = false; drawReminders(); }));
        });
        remWrap.appendChild(chipBtn(isCustom ? '✏️ ' + reminderLabel(cur) : '✏️ Perso', isCustom, ()=>{
          const base = isCustom ? cur : 90;
          const startVal = String(Math.floor(base/60)).padStart(2,'0') + ':' + String(base%60).padStart(2,'0');
          openTimeWheel(startVal, (val)=>{
            if (!val) return;
            const mins = toMin(val);
            if (!mins) { toast('Choisis une durée d\'au moins 5 minutes.'); return; }
            ev.reminder = mins; remOpen = false; drawReminders();
          }, { title: 'Rappel combien de temps avant ?', clearLabel: null, units: true });
        }));
      }
      remNote.textContent = (ev.reminder !== null && ev.reminder !== undefined && !ev.start)
        ? "Sans heure de début, le rappel arrive le jour même à 8 h (« 24 h » : la veille à 8 h)."
        : '';
    }
    drawReminders();

    const partWrap = sheet.querySelector('#f-participants');
    function drawChips(){
      partWrap.innerHTML='';
      state.profiles.forEach(p=>{
        const on = ev.participants.includes(p.id);
        const c = document.createElement('button'); c.type='button';
        c.className='chip'+(on?' on':''); c.style.background = on?p.color:'var(--surface)';
        c.style.borderColor = on?p.color:'var(--line)';
        c.innerHTML = `<span class="dot" style="background:${on?'#fff':p.color}"></span>${p.name}`;
        c.onclick = ()=>{
          if (on) ev.participants = ev.participants.filter(id=>id!==p.id);
          else ev.participants.push(p.id);
          drawChips();
        };
        partWrap.appendChild(c);
      });
    }
    drawChips();
    sheet.querySelector('#f-start-btn').onclick = ()=>{
      openTimeWheel(ev.start, (val)=>{
        ev.start = val;
        sheet.querySelector('#f-start-btn').textContent = val || '--:--';
        drawReminders();
      });
    };
    sheet.querySelector('#f-end-btn').onclick = ()=>{
      openTimeWheel(ev.end, (val)=>{ ev.end = val; sheet.querySelector('#f-end-btn').textContent = val || '--:--'; });
    };
    sheet.querySelector('#close-form').onclick = closeForm;
    sheet.querySelector('#f-save').onclick = async ()=>{
      const title = sheet.querySelector('#f-title').value.trim();
      if (!title) { sheet.querySelector('#f-title').focus(); return; }
      ev.title = title;
      if (!ev.participants.length && state.activeId) ev.participants=[state.activeId];
      const btn = sheet.querySelector('#f-save'); btn.disabled = true; btn.textContent = 'Enregistrement…';
      snapshot();
      try {
        const pushedIds = [];
        if (bulk) {
          for (const ds of bulk) {
            const newId = uid();
            await upsertEventDb({ id: newId, title, date: ds, start: ev.start, end: ev.end, icon: ev.icon||'', reminder: ev.reminder ?? null, important: !!ev.important, lieu: ev.lieu || '', participants: [...ev.participants] });
            pushedIds.push(newId);
          }
          await logActivity(`a ajouté « ${title} » sur ${bulk.length} jours`);
          view.selectMode = false; view.selectedDays = [];
        } else {
          ev.date = sheet.querySelector('#f-date').value || ev.date;
          const existed = state.events.some(x=>x.id===ev.id);
          await upsertEventDb(ev);
          await logActivity(existed ? `a modifié « ${title} »` : `a ajouté « ${title} »`);
          pushedIds.push(ev.id);
        }
        await reloadHouseholdData();
        pushedIds.forEach(id=>syncToGoogle('push', { event_id: id }));
        view.sheet = null;
      } catch(err){
        alert("Erreur d'enregistrement : "+err.message);
      }
      render();
    };
    if (linked) {
      const hide = document.createElement('button');
      hide.type = 'button'; hide.className = 'ghost-btn';
      hide.textContent = 'Masquer cet événement';
      hide.onclick = async ()=>{
        hide.disabled = true;
        await removeEvent(ev);
        view.sheet = null;
        render();
      };
      sheet.appendChild(hide);
      const detach = document.createElement('button');
      detach.type = 'button'; detach.className = 'ghost-btn';
      detach.textContent = 'Détacher (copie modifiable)';
      detach.onclick = async ()=>{
        if (!confirm(`Détacher « ${ev.title} » ?\n\nIl deviendra un événement normal, modifiable, et ne suivra plus les changements de « ${srcLink ? srcLink.nom : 'la source'} ».`)) return;
        detach.disabled = true;
        try {
          const { error } = await sb.from('events').update({ detache:true }).eq('id', ev.id);
          if (error) throw error;
          await logActivity(`a détaché « ${ev.title} » de son agenda lié`);
          await reloadHouseholdData();
          toast('Événement détaché : tu peux maintenant le modifier librement.');
          const fresh = state.events.find(x=>x.id===ev.id);
          if (fresh) { view.editingEvent = {...fresh, participants:[...fresh.participants]}; render(); return; }
        } catch(err){ alert('Erreur : ' + ((err && err.message) || 'inconnue')); }
        view.sheet = null; render();
      };
      sheet.appendChild(detach);
    } else if (!bulk && !isNew) {
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'danger-btn';
      del.textContent = '🗑 Supprimer cet événement';
      del.onclick = async ()=>{
        if (!confirm(`Supprimer « ${ev.title} » ?`)) return;
        del.disabled = true;
        await removeEvent(ev);
        view.sheet = null;
        render();
      };
      sheet.appendChild(del);
    }
    scrim.appendChild(sheet);
    return scrim;
  }


  /* ---------- Agendas liés (1.2) ---------- */
  // Mes agendas liés + ceux des profils invités (Commun, enfants), gérés par les deux parents
  function myLinks(){
    const me = state.myProfile ? state.myProfile.id : null;
    return (state.links || []).filter(l=>{
      if (l.profile_id === me) return true;
      const p = profileById(l.profile_id);
      return !!(p && !p.user_id);
    });
  }
  // Profils à qui on peut rattacher un agenda lié : soi-même, puis les profils invités
  function linkTargets(){
    const me = state.myProfile;
    return [me, ...state.profiles.filter(p=>!p.user_id)].filter(Boolean);
  }
  // Appel de la fonction serveur « agenda-lies » ; renvoie ses données ou lève une erreur lisible
  async function callLinks(body){
    const { data, error } = await sb.functions.invoke('agenda-lies', { body });
    if (error) {
      let msg = error.message || 'erreur inconnue';
      try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch(e){}
      throw new Error(msg);
    }
    if (data && data.error) throw new Error(data.error);
    return data || {};
  }
  function fmtAgo(iso){
    if (!iso) return 'jamais actualisé';
    const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (min < 1) return "actualisé à l'instant";
    if (min < 60) return `actualisé il y a ${min} min`;
    if (min < 24*60) return `actualisé il y a ${Math.round(min/60)} h`;
    return 'actualisé le ' + fmtTime(new Date(iso).getTime());
  }
  function syncSummary(results){
    const r = (results || [])[0];
    if (!r) return 'Rien à actualiser.';
    if (r.error) return `« ${r.nom} » : ${r.error}`;
    const parts = [];
    if (r.added) parts.push(`${r.added} ajouté${r.added>1?'s':''}`);
    if (r.updated) parts.push(`${r.updated} modifié${r.updated>1?'s':''}`);
    if (r.removed) parts.push(`${r.removed} retiré${r.removed>1?'s':''}`);
    return `« ${r.nom} » : ` + (parts.length ? parts.join(', ') : 'déjà à jour') + '.';
  }
  function fmtDateShort(ds){
    if (!ds) return '';
    return new Date(ds+'T00:00:00').toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });
  }

  function renderLinksSheet(){
    const scrim = document.createElement('div'); scrim.className='scrim';
    scrim.onclick = (e)=>{ if(e.target===scrim){ view.sheet='switch'; render(); } };
    const sheet = document.createElement('div'); sheet.className='sheet';
    const me = activeProfile();
    const links = myLinks();
    sheet.innerHTML = `<div class="sheet-handle"></div>
      <div class="sheet-header"><h2>Mes agendas liés</h2><button class="sheet-close" id="close-links">✕</button></div>
      <div id="links-list"></div>
      ${links.length > 1 ? '<button class="ghost-btn" id="links-refresh-all">Tout actualiser</button>' : ''}
      <button class="save-btn" id="links-add" style="margin-top:10px;">+ Ajouter un lien</button>`;
    const list = sheet.querySelector('#links-list');
    if (!links.length) {
      const p = document.createElement('div'); p.className = 'bulk-note';
      p.innerHTML = "Colle ici le lien d'un agenda (chorale, club, école, ou ton agenda Google au format iCal) : ses événements arriveront tout seuls dans EarthShade, à ton nom, et se mettront à jour chaque heure.";
      list.appendChild(p);
    }
    links.forEach(l=>{
      const count = state.events.filter(e=>e.sourceId===l.id && !e.detache).length;
      const masked = state.maskedBySource[l.id] || 0;
      const isErr = /^Erreur/.test(l.dernier_statut || '');
      const busy = view._linkBusy === l.id;
      const owner = profileById(l.profile_id);
      const card = document.createElement('div'); card.className = 'link-card';
      card.innerHTML = `
        <div class="link-badge" style="background:${owner ? owner.color : (me ? me.color : 'var(--ink)')}">${l.icone ? escapeHtml(l.icone) : lineIcon(LINK_PATHS, 20)}</div>
        <div class="link-body">
          <div class="link-name">${escapeHtml(l.nom)}</div>
          ${owner && me && owner.id !== me.id ? `<div class="link-meta">Pour : <b>${escapeHtml(owner.name)}</b></div>` : ''}
          <div class="link-meta">${busy ? 'Actualisation en cours…' : `${count} événement${count>1?'s':''} · ${fmtAgo(l.derniere_actualisation)}`}</div>
          ${isErr && !busy ? `<div class="link-meta err">${escapeHtml(l.dernier_statut)}</div>` : ''}
          ${masked ? `<div class="link-meta">${masked} masqué${masked>1?'s':''}</div>` : ''}
          <div class="link-meta">${l.envoyer_google ? 'Envoyé aussi vers Agenda Famille' : 'Pas envoyé vers Google'}</div>
          ${l.important ? '<div class="link-meta"><span class="imp-mark">★</span> Tous ses événements sont en Important</div>' : ''}
          <div class="link-actions">
            <button type="button" data-act="refresh" ${busy?'disabled':''}>Actualiser</button>
            <button type="button" data-act="important" ${busy?'disabled':''}>${l.important ? '★ Retirer Important' : '☆ Tout en Important'}</button>
            ${masked ? `<button type="button" data-act="unhide" ${busy?'disabled':''}>Réafficher les masqués</button>` : ''}
            <button type="button" class="danger" data-act="delete" ${busy?'disabled':''}>Supprimer</button>
          </div>
        </div>`;
      const run = async (body, okMsg)=>{
        view._linkBusy = l.id; render();
        try {
          const data = await callLinks(body);
          await reloadHouseholdData();
          toast(okMsg ? okMsg(data) : syncSummary(data.results));
        } catch(err){ toast('Échec : ' + err.message); }
        view._linkBusy = null; render();
      };
      card.querySelector('[data-act="refresh"]').onclick = ()=>run({ action:'actualiser', lien_id:l.id });
      // 1.4 : « Important » pour tout l'agenda (les déjà importés ET les futurs)
      card.querySelector('[data-act="important"]').onclick = ()=>{
        const next = !l.important;
        const ask = next
          ? `Mettre tous les événements de « ${l.nom} » en Important ?\n\nLes prochains qui arriveront auront aussi l'étoile. Ceux que tu as détachés ne changent pas.`
          : `Retirer Important sur tous les événements de « ${l.nom} » ?\n\nCela retire aussi les étoiles que tu aurais mises à la main sur certains d'entre eux. Ceux que tu as détachés ne changent pas.`;
        if (!confirm(ask)) return;
        run({ action:'important', lien_id:l.id, important:next }, (d)=>{
          const r = (d.results || [])[0];
          const base = next ? `Tous les événements de « ${l.nom} » sont en Important.` : `Important retiré sur « ${l.nom} ».`;
          return (r && r.error) ? `${base} L'actualisation a échoué : ${r.error}` : base;
        });
      };
      const un = card.querySelector('[data-act="unhide"]');
      if (un) un.onclick = ()=>run({ action:'reafficher', lien_id:l.id }, ()=>`${masked} événement${masked>1?'s':''} réaffiché${masked>1?'s':''}.`);
      card.querySelector('[data-act="delete"]').onclick = ()=>{
        if (!confirm(`Supprimer l'agenda lié « ${l.nom} » ?\n\nSes événements disparaîtront d'EarthShade (et de Google Agenda). Ceux que tu as détachés restent.`)) return;
        run({ action:'supprimer_lien', lien_id:l.id }, (d)=>`« ${l.nom} » supprimé (${d.removed||0} événement${(d.removed||0)>1?'s':''} retiré${(d.removed||0)>1?'s':''}).`);
      };
      list.appendChild(card);
    });
    sheet.querySelector('#close-links').onclick = ()=>{ view.sheet='switch'; render(); };
    const all = sheet.querySelector('#links-refresh-all');
    if (all) all.onclick = async ()=>{
      all.disabled = true; all.textContent = 'Actualisation en cours…';
      try {
        const data = await callLinks({ action:'actualiser' });

  function backfillLabel(){ return `Sauvegarde en cours… ${backfill.done} envoyé${backfill.done>1?'s':''}`; }
  async function runBackfill(){
    if (backfill.running) return;
    backfill.running = true; backfill.done = 0;
    const btnNow = ()=>document.getElementById('backfill-btn');
    let done = 0;
    try {
      for (let pass=0; pass<200; pass++) {
        backfill.done = done;
        { const b = btnNow(); if (b) { b.disabled = true; b.textContent = backfillLabel(); } }
        const { data, error } = await sb.functions.invoke('google-calendar', { body:{ action:'push_all', limit:40 } });
        if (error) throw error;
        if (data && data.error) throw new Error(data.error);
        done += (data && data.done) || 0;
        if (data && data.failures && data.failures.length) console.warn('Non envoyés :', data.failures);
        if (!data || !data.remaining || !data.done) break;
      }
      backfill.running = false;
      await reloadHouseholdData();
      toast(`Sauvegarde terminée : ${done} événement${done>1?'s':''} envoyé${done>1?'s':''} dans Google.`);
      render();
    } catch(err){
      backfill.running = false;
      await reloadHouseholdData().catch(()=>{});
      render();
      toast('Sauvegarde interrompue : ' + ((err&&err.message)||'erreur'));
    }
  }

  const WHEEL_HOURS = Array.from({length:24},(_,i)=>i);
  const WHEEL_MINUTES = [0,5,10,15,20,25,30,35,40,45,50,55];
  const WHEEL_ITEM_H = 44;

  const WHEEL_REPEAT = 9;
  function wheelOpacity(col, idx){
    [...col.children].forEach((el,i)=>{ el.style.opacity = i===idx?'1':'.35'; });
  }
  function fillWheelCol(col, values, selIdx, onSettle){
    const n = values.length;
    const mid = Math.floor(WHEEL_REPEAT/2);
    let html = '';
    for (let r=0; r<WHEEL_REPEAT; r++){
      values.forEach(v=>{ html += `<div class="wheel-item">${String(v).padStart(2,'0')}</div>`; });
    }
    col.innerHTML = html;
    const total = n*WHEEL_REPEAT;
    let curIdx = mid*n + selIdx;
    col.scrollTop = curIdx * WHEEL_ITEM_H;
    wheelOpacity(col, curIdx);
    let t=null;
    col.addEventListener('scroll', ()=>{
      if (t) clearTimeout(t);
      t = setTimeout(()=>{
        let idx = Math.round(col.scrollTop / WHEEL_ITEM_H);
        idx = Math.max(0, Math.min(total-1, idx));
        if (col.scrollTop !== idx*WHEEL_ITEM_H) col.scrollTo({top: idx*WHEEL_ITEM_H, behavior:'smooth'});
        wheelOpacity(col, idx);
        const realVal = values[((idx % n)+n)%n];
        onSettle(realVal);
        if (idx < n*1.5 || idx > total - n*1.5) {
          setTimeout(()=>{
            const newIdx = mid*n + (((idx % n)+n)%n);
            col.scrollTop = newIdx * WHEEL_ITEM_H;
            wheelOpacity(col, newIdx);
          }, 260);
        }
      }, 130);
    });
  }

  function openTimeWheel(currentValue, onConfirm, opts){
    opts = opts || {};
    const wpTitle = opts.title || "Choisir l'heure";
    const clearLabel = opts.clearLabel === undefined ? 'Aucune heure' : opts.clearLabel;
    let h = 8, m = 0;
    if (currentValue) {
      const parts = currentValue.split(':');
      h = parseInt(parts[0],10) || 0;
      m = Math.round((parseInt(parts[1],10)||0)/5)*5;
      if (m>55) m=55;
    }
    let curH = h, curM = m;
    const hIdx = WHEEL_HOURS.indexOf(h);
    const mIdx = WHEEL_MINUTES.indexOf(m);

    const scrim = document.createElement('div'); scrim.className='scrim center'; scrim.style.zIndex='30';
    const sheet = document.createElement('div'); sheet.className='sheet';
    sheet.innerHTML = `
      <div class="sheet-header"><h2>${escapeHtml(wpTitle)}</h2><button class="sheet-close" id="wp-close">✕</button></div>
      <div class="wheel-frame">
        <div class="wheel-highlight"></div>
        <div class="wheel-picker">
          <div class="wheel-col" id="wp-hour"></div>
          <div class="wheel-colon">${opts.units ? 'h' : ':'}</div>
          <div class="wheel-col" id="wp-min"></div>${opts.units ? '<div class="wheel-colon">min</div>' : ''}
        </div>
      </div>
      ${clearLabel ? `<button class="ghost-btn" id="wp-clear">${escapeHtml(clearLabel)}</button>` : ''}
      <button class="save-btn" id="wp-set">Définir</button>
    `;
    fillWheelCol(sheet.querySelector('#wp-hour'), WHEEL_HOURS, hIdx, (v)=>{ curH=v; });
    fillWheelCol(sheet.querySelector('#wp-min'), WHEEL_MINUTES, mIdx, (v)=>{ curM=v; });
    sheet.querySelector('#wp-close').onclick = ()=>scrim.remove();
    if (clearLabel) sheet.querySelector('#wp-clear').onclick = ()=>{ onConfirm(''); scrim.remove(); };
    sheet.querySelector('#wp-set').onclick = ()=>{
      onConfirm(`${String(curH).padStart(2,'0')}:${String(curM).padStart(2,'0')}`);
      scrim.remove();
    };
    scrim.onclick = (e)=>{ if(e.target===scrim) scrim.remove(); };
    scrim.appendChild(sheet);
    document.body.appendChild(scrim);
    const midRep = Math.floor(WHEEL_REPEAT/2);
    const hourCol = sheet.querySelector('#wp-hour'), minCol = sheet.querySelector('#wp-min');
    hourCol.scrollTop = (midRep*WHEEL_HOURS.length + hIdx) * WHEEL_ITEM_H;
    minCol.scrollTop = (midRep*WHEEL_MINUTES.length + mIdx) * WHEEL_ITEM_H;
    wheelOpacity(hourCol, midRep*WHEEL_HOURS.length + hIdx);
    wheelOpacity(minCol, midRep*WHEEL_MINUTES.length + mIdx);
  }

  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function detectLandscapePhone(){
    let land;
    try {
      land = (screen.orientation && screen.orientation.type)
        ? screen.orientation.type.indexOf('landscape') === 0
        : Math.abs(window.orientation || 0) === 90;
    } catch(e){ land = window.innerWidth > window.innerHeight; }
    const small = Math.min(screen.width || 9999, screen.height || 9999) < 600;
    return !!land && small;
  }

    dayScrollTop = null;

  function updateLayout(){

    const changedWide = document.body.classList.contains('is-wide') !== wide;
    const changedLp = lp !== landscapePhone;
    document.body.classList.toggle('is-wide', wide);
    document.body.classList.toggle('compact-h', lp);
    if (changedLp) { landscapePhone = lp; applyOrientationSwitch(lp); }
    if (changedWide || changedLp) { stashFormFields(); render(); }
  }
  let layoutTimer = null;
  window.addEventListener('resize', ()=>{

  window.addEventListener('orientationchange', ()=>{

  // Le panneau vit en dehors de #app : les mises à jour de l'agenda (qui redessinent #app)
  // ne ferment donc ni le clavier, ni un article en cours de modification.
  // Téléphone : panneau qui monte du bas (fermer en le tirant vers le bas, ou en touchant l'agenda).
  // PC / paysage : colonne à droite du calendrier (icône « Listes » du menu de gauche).
  // Gestes sur un article : toucher la ligne = cocher ; glisser à gauche = supprimer (Annuler 5 s) ;
  // glisser à droite = modifier (texte, quantité, unité) — clic droit sur PC ; poignée ⋮⋮ = déplacer.
  const LP_UNITS = ['g','kg','cl','L'];
  const LP_CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const LP_GRIP = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="3.5" r="1.5"/><circle cx="10.5" cy="3.5" r="1.5"/><circle cx="5.5" cy="8" r="1.5"/><circle cx="10.5" cy="8" r="1.5"/><circle cx="5.5" cy="12.5" r="1.5"/><circle cx="10.5" cy="12.5" r="1.5"/></svg>';
  function listIcon(size){
    const s = size || 22;
    return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6.5l1.5 1.5 3-3"/><path d="M3.5 13.5l1.5 1.5 3-3"/><line x1="11" y1="6.5" x2="21" y2="6.5"/><line x1="11" y1="13.5" x2="21" y2="13.5"/><line x1="11" y1="19.5" x2="21" y2="19.5"/><circle cx="5.5" cy="19.5" r="1.3"/></svg>`;
  }

  let lpTab = (()=>{ try { return localStorage.getItem('es-lists-tab') || 'courses'; } catch(e){ return 'courses'; } })();
  let lpEditing = null, lpEditUnit = '', lpMove = null, lpSwipe = null, lpDrag = null;
  let lpDirty = false, lpConfirmClear = false, lpSuppressClick = false, lpFreshId = null, lpToastTimer = null;
  const lpEl = {};

  function listsOpen(){ return document.body.classList.contains('lists-open'); }
  function mapArticle(a){
    return { id:a.id, liste:a.liste, texte:a.texte, qte:Number(a.quantite)||1,
             mesure: (a.mesure === null || a.mesure === undefined) ? '' : String(Number(a.mesure)),
             unite:a.unite || '', coche:!!a.coche, cocheLe:a.coche_le ? new Date(a.coche_le).getTime() : 0,
             ajoutePar:a.ajoute_par || null, pos:Number(a.position)||0,
             nb:Number(a.nb_coches)||0, nbJour:Number(a.nb_coches_jour)||0, jour:a.jour_coches || '' };

  async function reloadArticles(){
    if (!state.household) return;
    try {
      const { data, error } = await sb.from('articles').select('*').eq('household_id', state.household.id);
      if (error) throw error;
      state.articles = (data || []).map(mapArticle);

  // Onglets : Courses, puis une to-do par personne ayant un compte (moi d'abord). Pas pour les profils invités.
  function listTabs(){
    const me = state.myProfile ? state.myProfile.id : null;
    const people = state.profiles.filter(p=>p.user_id).sort((a,b)=> (a.id===me ? -1 : b.id===me ? 1 : String(a.name).localeCompare(String(b.name), 'fr')));
    return [{ key:'courses', label:'Courses', icon:'🛒' }].concat(people.map(p=>({ key:p.id, label:p.name, color:p.color })));
  }
  const lpOpenIn = key => (state.articles || []).filter(a=>a.liste===key && !a.coche);
  const lpById = id => (state.articles || []).find(a=>a.id===id);
  // 2.1 : « Déjà pris » des courses trié du plus acheté au moins acheté. On compte les coches ;
  // celles du jour ne comptent pour le tri qu'à partir de minuit : rien ne bouge pendant les courses.
  function lpToday(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function lpRank(a){ return a.nb - (a.jour === lpToday() ? a.nbJour : 0); }
  // Coche : +1 (et +1 pour aujourd'hui). Décoche le jour même (erreur, ou article repris) : on retire cette coche.
  function lpCountCheck(a, checked){
    const today = lpToday();
    if (checked) { if (a.jour !== today) { a.jour = today; a.nbJour = 0; } a.nb += 1; a.nbJour += 1; }
    else if (a.jour === today && a.nbJour > 0) { a.nb = Math.max(0, a.nb - 1); a.nbJour -= 1; }
    return { nb_coches:a.nb, nb_coches_jour:a.nbJour, jour_coches:a.jour || null };
  }
  function lpFmt(a){ return a.unite ? (a.mesure ? `${a.mesure.replace('.', ',')} ${a.unite}` : a.unite) : ''; }
  function updateListBadges(){
    const n = lpOpenIn('courses').length;
    document.querySelectorAll('.lp-badge').forEach(b=>{ b.textContent = n; b.hidden = !n; });

  /* ---------- Construction du panneau (une seule fois) ---------- */

      </div>

  function openLists(){

  /* ---------- Affichage ---------- */
  function lpRowHtml(a){
    if (lpEditing === a.id) {
      return `<div class="lp-wrap editing" data-wrap="${a.id}"><form class="lp-editor" data-edit="${a.id}">
        <input class="lp-edit-text" type="text" value="${escapeAttr(a.texte)}" enterkeyhint="done" maxlength="200" aria-label="Texte de l'article">
        ${a.liste !== 'courses' ? '' : `<div class="lp-line">
          <input class="lp-amt" type="text" inputmode="decimal" placeholder="100" value="${escapeAttr(a.mesure)}"${lpEditUnit?'':' hidden'} aria-label="Quantité">
          <div class="lp-unit"><button type="button" class="lp-unit-btn" aria-haspopup="true" aria-expanded="false"><span>${lpEditUnit || 'Unité'}</span><svg width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg></button>
            <div class="lp-unit-menu" hidden>${LP_UNITS.map(u=>`<button type="button" data-unit="${u}" class="${u===lpEditUnit?'on':''}">${u}</button>`).join('')}<button type="button" data-unit="" class="none">Aucune</button></div></div>
          <div class="lp-step"><button type="button" data-q="-1" aria-label="Moins">−</button><span class="lp-edit-qty">x${a.qte}</span><button type="button" data-q="1" aria-label="Plus">+</button></div>
        </div>`}
        <div class="lp-line"><button class="lp-trash" type="button" data-del="${a.id}">Supprimer</button><button class="lp-ok" type="submit">OK</button></div>
      </form></div>`;

      + `<span class="lp-box">${a.coche?LP_CHECK:''}</span><span class="lp-txt">${escapeHtml(a.texte)}</span>`
      + (fmt ? `<span class="lp-fmt">${escapeHtml(fmt)}</span>` : '')
      + (a.qte > 1 ? `<span class="lp-qty">x${a.qte}</span>` : '')
      + (by ? `<span class="lp-by" style="background:${by.color}" title="Ajouté par ${escapeAttr(by.name)}">${escapeHtml((by.name||'?')[0].toUpperCase())}</span>` : '')
      + (a.coche ? '' : `<span class="lp-grip" data-grip="${a.id}" aria-label="Déplacer">${LP_GRIP}</span>`)
      + '</div></div>';

  function renderLists(){
    if (!lpEl.panel) return;
    if (lpEditing || lpMove || (lpSwipe && lpSwipe.live)) { lpDirty = true; return; }   // pas sous le doigt : ce sera fait juste après
    lpDirty = false;
    const tabs = listTabs();
    if (!tabs.some(t=>t.key===lpTab)) lpTab = 'courses';
    lpEl.tabs.innerHTML = tabs.map(t=>{
      const n = lpOpenIn(t.key).length;
      const lead = t.icon ? `<span aria-hidden="true">${t.icon}</span>` : `<span class="lp-who" style="background:${t.color}"></span>`;
      return `<button type="button" class="lp-tab${t.key===lpTab?' on':''}" data-tab="${t.key}">${lead}<span>${escapeHtml(t.label)}</span><span class="lp-n">${n || ''}</span></button>`;
    }).join('');
    const courses = lpTab === 'courses';
    const mine = (state.articles || []).filter(a=>a.liste===lpTab);

    const done = mine.filter(a=>a.coche).sort(courses
      ? (a,b)=>(lpRank(b) - lpRank(a)) || a.texte.localeCompare(b.texte, 'fr', { sensitivity:'base' })

    else if (!open.length) h = `<div class="lp-empty">${courses ? 'Tout est pris' : 'Tout est fait'}</div>`;

      if (lpConfirmClear) h += `<div class="lp-confirm"><span>Retirer ${done.length > 1 ? `les ${done.length} articles` : "l'article"} ${courses ? (done.length>1?'déjà pris':'déjà pris') : (done.length>1?'faits':'fait')} ?</span><button class="no" type="button" data-act="clear-no">Garder</button><button class="yes" type="button" data-act="clear-yes">Retirer</button></div>`;
      h += done.map(lpRowHtml).join('');

  /* ---------- Message en bas du panneau (avec « Annuler » quand c'est possible) ---------- */

    const t = lpEl.toast, b = t.querySelector('button');
    t.querySelector('span').textContent = msg;
    b.hidden = !action; b.textContent = label || 'Annuler';
    b.onclick = ()=>{ t.classList.remove('show'); if (action) action(); };
    t.classList.add('show');
    clearTimeout(lpToastTimer);
    lpToastTimer = setTimeout(()=>t.classList.remove('show'), action ? 5000 : 2600);

  /* ---------- Écritures (l'écran change tout de suite, la base suit) ---------- */
  function lpRowFor(a){
    return { id:a.id, household_id:state.household.id, liste:a.liste, texte:a.texte, quantite:a.qte,
             mesure: a.unite && a.mesure ? Number(a.mesure) : null, unite: a.unite || null,
             coche:a.coche, coche_le: a.coche ? new Date(a.cocheLe || Date.now()).toISOString() : null,
             coche_par: a.coche ? (state.myProfile && state.myProfile.id) : null, ajoute_par:a.ajoutePar, position:a.pos,
             nb_coches:a.nb || 0, nb_coches_jour:a.nbJour || 0, jour_coches:a.jour || null };
  }
  async function lpInsert(list){
    const { error } = await sb.from('articles').insert(list.map(lpRowFor));
    if (error) lpFail(error);
  }
  async function lpUpdate(a, fields){
    const patch = Object.assign({ updated_at:new Date().toISOString() }, fields);
    const { error } = await sb.from('articles').update(patch).eq('id', a.id);
    if (error) lpFail(error);
  }
  async function lpRemove(list){
    if (!list.length) return;
    const { error } = await sb.from('articles').delete().in('id', list.map(a=>a.id));
    if (error) lpFail(error);
  }
  function lpNextPos(key){ return Math.max(0, ...(state.articles || []).filter(a=>a.liste===key).map(a=>a.pos)) + 1; }
  function lpDeleteWithUndo(list, msg){
    const ids = new Set(list.map(a=>a.id));
    state.articles = state.articles.filter(a=>!ids.has(a.id));
    renderLists(); updateListBadges();
    lpRemove(list);
    lpToast(msg, ()=>{ state.articles = state.articles.concat(list); renderLists(); updateListBadges(); lpInsert(list); });
  }

  // Ajouter : déjà dans « Déjà pris » -> il remonte ; déjà à prendre -> on propose x2
  function lpAdd(e){
    e.preventDefault(); lpSaveEdit();
    if (!state.household || !state.myProfile) return;
    const text = lpEl.input.value.trim().replace(/\s+/g, ' ').slice(0, 200);
    if (!text) { lpEl.input.focus(); return; }
    const low = text.toLocaleLowerCase('fr');
    const same = (state.articles || []).find(a=>a.liste===lpTab && a.texte.toLocaleLowerCase('fr') === low);
    if (same && same.coche) {
      same.coche = false; same.pos = lpNextPos(lpTab); lpFreshId = same.id;
      lpUpdate(same, Object.assign({ coche:false, coche_le:null, coche_par:null, position:same.pos }, lpCountCheck(same, false)));
      lpToast(`« ${same.texte} » remis dans la liste`);
    } else if (same) {
      lpToast(`« ${same.texte} » est déjà dans la liste`, ()=>{
        same.qte = Math.min(99, same.qte + 1); lpFreshId = same.id; renderLists();
        lpUpdate(same, { quantite:same.qte });
      }, `Passer à x${Math.min(99, same.qte + 1)}`);
    } else {
      const a = { id:uid(), liste:lpTab, texte:text.charAt(0).toLocaleUpperCase('fr') + text.slice(1), qte:1, mesure:'', unite:'',
                  coche:false, cocheLe:0, ajoutePar:state.myProfile.id, pos:lpNextPos(lpTab), nb:0, nbJour:0, jour:'' };
      state.articles.push(a); lpFreshId = a.id;
      lpInsert([a]);
    }
    lpEl.input.value = ''; lpEl.input.focus();
    renderLists(); updateListBadges();

  function lpSaveEdit(){

      const qEl = form.querySelector('.lp-edit-qty'), amEl = form.querySelector('.lp-amt');   // absents dans une to-do
      const qte = qEl ? (parseInt(qEl.textContent.replace(/\D/g, ''), 10) || 1) : a.qte;
      const unite = amEl ? lpEditUnit : a.unite;
      let mesure = !amEl ? a.mesure : (unite ? amEl.value.trim().replace(',', '.').replace(/[^0-9.]/g, '') : '');
      if (mesure && !(Number(mesure) > 0)) mesure = '';
      if (mesure) mesure = String(Number(mesure));
      const changed = (txt && txt !== a.texte) || qte !== a.qte || unite !== a.unite || mesure !== a.mesure;
      if (changed) {

  /* ---------- Toucher, cliquer, glisser ---------- */
  function lpBlockClick(){ lpSuppressClick = true; setTimeout(()=>{ lpSuppressClick = false; }, 400); }
  function lpBindListEvents(){
    const list = lpEl.list;

    });
    // Clic droit (PC) = modifier
    list.addEventListener('contextmenu', e=>{

    });

    // Glisser un article : à gauche = supprimer, à droite = modifier
    list.addEventListener('touchstart', e=>{
      const r = e.target.closest('.lp-row'); if (!r || e.target.closest('.lp-grip') || lpEditing || e.touches.length !== 1) return;

    list.addEventListener('pointerdown', e=>{

      e.preventDefault(); lpDrag = null;
      const wrap = g.closest('.lp-wrap');
      const wraps = [...list.querySelectorAll('.lp-open > .lp-wrap')];
      lpMove = { wrap, wraps, from:wraps.indexOf(wrap), to:wraps.indexOf(wrap), y0:e.clientY, y:e.clientY, st0:list.scrollTop,

    const endMove = e=>{

        const open = state.articles.filter(a=>a.liste===lpTab && !a.coche).sort((a,b)=>a.pos - b.pos);
        const [m] = open.splice(from, 1); open.splice(to, 0, m);
        open.forEach((a, k)=>{ const p = k + 1; if (a.pos !== p) { a.pos = p; lpUpdate(a, { position:p }); } });

    list.addEventListener('pointercancel', endMove);

  function lpPlace(){
    const m = lpMove, list = lpEl.list;

    const mid = m.tops[m.from] + dy + m.h / 2;
    let to = 0; m.wraps.forEach((w, k)=>{ if (k !== m.from && m.tops[k] + w.offsetHeight / 2 < mid) to++; });

  // Téléphone : fermer le panneau en le tirant vers le bas (depuis le haut, ou depuis la liste quand elle est en haut)
  function lpBindPanelDrag(){
    const panel = lpEl.panel, list = lpEl.list;
    panel.addEventListener('touchstart', e=>{
      lpDrag = null;

      const inTop = !!e.target.closest('.lp-top');

      lpDrag = { y:e.touches[0].clientY, x:e.touches[0].clientX, dy:0, live:false };
    }, { passive:true });

      if (!lpDrag) return;

        if (dy > 8 && dy > dx) { lpDrag.live = true; panel.classList.add('dragging'); }

      panel.classList.remove('dragging');

  }
  // 2.1 : sur Android, le clavier passe PAR-DESSUS la page (elle ne rétrécit pas) : le bas du panneau
  // se retrouvait caché. Quand le clavier est sorti, le panneau se pose juste au-dessus de lui.
  function lpFitKeyboard(){
    if (!lpEl.panel) return;
    const vv = window.visualViewport;
    const reset = ()=>{ lpEl.panel.style.bottom = ''; lpEl.panel.style.height = ''; };
    if (!vv || isWide() || !listsOpen()) { reset(); return; }
    const hidden = Math.round(window.innerHeight - vv.height - vv.offsetTop);
    if (hidden > 80) {
      lpEl.panel.style.bottom = hidden + 'px';
      lpEl.panel.style.height = Math.round(Math.min(vv.height * 0.92, window.innerHeight * 0.8)) + 'px';
      const f = document.activeElement;
      if (f && lpEl.panel.contains(f) && lpEl.list.contains(f)) setTimeout(()=>f.scrollIntoView({ block:'nearest' }), 60);

  }

    window.visualViewport.addEventListener('resize', lpFitKeyboard);

  document.addEventListener('keydown', e=>{

  // Au retour sur l'appli (téléphone rallumé, onglet revenu) : on relit les listes

  setInterval(lpFlush, 1000);



  /* ================================================================== */
  /* 3.0 : Menus de la semaine — midi + soir sur l'agenda               */
  /* ================================================================== */
  // Bouton fourchette (en-tête ; « Menus » dans le menu de gauche sur PC) : comme « Cas », il
  // transforme la vue mois. Les cases montrent ☀ midi et ☾ soir À LA PLACE des événements.
  // Toucher une case ouvre la fenêtre du repas sur la ligne la plus proche du doigt. Fourchette et Cas s'excluent.
  // 3.1 : un repas peut avoir plusieurs plats (« Quiche lorraine » + « Salade »), chacun gardé à part dans la banque.
  // La fenêtre vit en dehors de #app : une mise à jour de l'agenda ne ferme ni le clavier ni la fenêtre.
  const FORK_SVG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v7a2 2 0 0 0 2 2 2 2 0 0 0 2-2V3"/><line x1="9" y1="3" x2="9" y2="21"/><path d="M17 21V3c-2.2 1.2-3.2 3.6-3.2 6.5 0 2.2 1.3 3.5 3.2 3.5"/></svg>';

  function mnKey(ds, moment){ return ds + '|' + moment; }
  function mnMeal(ds, moment){ return (state.repas || {})[mnKey(ds, moment)] || null; }
  const mnLow = s => String(s || '').toLocaleLowerCase('fr');

  async function reloadMenus(){
    if (!state.household) return;
    const hid = state.household.id;
    try {
      const [{ data: rp, error: e1 }, { data: rc, error: e2 }] = await Promise.all([

  /* ---------- Dans la case du mois ---------- */
  function mnCellHtml(ds){
    const eaters = mnEaters();
    const line = (moment, ic)=>{
      const m = mnMeal(ds, moment);
      if (!m) return `<div class="mn-meal empty" data-k="${moment}"><i>${ic}</i><span class="mn-t">—</span></div>`;
      const who = m.mangeurs.filter(id=>eaters.some(p=>p.id===id));
      const all = eaters.every(p=>who.includes(p.id));
      const dots = all ? '' : `<span class="mn-dots">${who.length ? eaters.filter(p=>who.includes(p.id)).map(p=>`<b style="background:${p.color}"></b>`).join('') : '<em>personne</em>'}</span>`;
      const start = m.plats.length === 1 ? 3 : 2;   // un plat : jusqu'à 3 lignes ; plusieurs : 2 chacun (réduit ensuite si ça déborde)
      return `<div class="mn-meal${all ? '' : ' has-dots'}" data-k="${moment}" lang="fr">${m.plats.map(p=>`<span class="mn-dish" style="-webkit-line-clamp:${start}" data-c="${start}">${escapeHtml(p)}</span>`).join('')}${dots}</div>`;
    };

  }
  // Après l'affichage : tant qu'un repas déborde de sa place, on retire une ligne au plat le plus long
  function mnFitCells(){
    document.querySelectorAll('.cal-viewport .mn-meal:not(.empty)').forEach(el=>{
      const dishes = [...el.querySelectorAll('.mn-dish')];
      mnFitWords(el, dishes);
      let guard = 20;
      while (guard-- && el.scrollHeight > el.clientHeight + 1) {
        const big = dishes.reduce((a,d)=> (Number(d.dataset.c) > Number(a ? a.dataset.c : 0) ? d : a), null);
        if (!big || Number(big.dataset.c) <= 1) break;
        const c = Number(big.dataset.c) - 1; big.dataset.c = c; big.style.webkitLineClamp = c; big.style.lineClamp = c;
      }
    });
  }
  // 3.2 : si un mot ne tient pas entier sur la largeur de la case (ex. « Jam-bon »),
  // la case réduit un peu son texte (12 % au plus) — seulement si ça suffit à le faire tenir
  function mnFitWords(el, dishes){
    if (!dishes.length) return;
    const avail = dishes[0].clientWidth;
    if (!avail) return;
    const probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;left:-9999px;top:0';
    el.appendChild(probe);
    let need = 1;
    dishes.forEach(d=>{
      String(d.textContent || '').split(/\s+/).forEach(w=>{
        if (!w) return;
        probe.textContent = w;
        const wpx = probe.getBoundingClientRect().width;
        if (wpx > avail + .5) need = Math.min(need, avail / wpx);
      });
    });

    if (need < 1 && need >= 0.88) {

    const toastEl = document.createElement('div'); toastEl.className = 'mn-toast'; toastEl.setAttribute('role', 'status');

    Object.assign(mnEl, { scrim, sheet, bar, toast:toastEl, search:sheet.querySelector('.mn-search'), recipes:sheet.querySelector('.mn-recipes'),
                          who:sheet.querySelector('.mn-who'), dishes:sheet.querySelector('.mn-dishes') });
    scrim.addEventListener('click', mnClose);
    sheet.querySelector('.mn-x').addEventListener('click', mnClose);
    sheet.querySelector('.mn-ok').addEventListener('click', mnOk);
    sheet.querySelector('.mn-erase').addEventListener('click', ()=>{ mnEl.search.value = ''; mnTyped = false; mnFill(); mnEl.search.focus(); });
    sheet.querySelector('.mn-clear').addEventListener('click', mnClear);
    sheet.querySelectorAll('.mn-tab').forEach(t=>t.addEventListener('click', ()=>{ mnCur.moment = t.dataset.m; mnResetField(); mnFill(); }));
    mnEl.search.addEventListener('input', ()=>{ mnTyped = !!mnEl.search.value.trim(); mnFill(); });
    mnEl.search.addEventListener('keydown', e=>{ if (e.key === 'Enter') { e.preventDefault(); const v = mnEl.search.value.trim(); if (v) mnAddDish(v); } });
    // Les plats du repas : ✕ retire, toucher le nom le remet dans le champ pour le corriger
    mnEl.dishes.addEventListener('click', e=>{
      const rm = e.target.closest('[data-rm]');
      if (rm) { mnRemoveDish(Number(rm.dataset.rm)); return; }
      const ed = e.target.closest('[data-edit]');
      if (ed) { const i = Number(ed.dataset.edit), m = mnMeal(mnCur.ds, mnCur.moment); if (!m) return;
        const nom = m.plats[i]; mnRemoveDish(i); mnEl.search.value = nom; mnTyped = true; mnFill(); mnEl.search.focus(); }
    });
    mnEl.recipes.addEventListener('click', e=>{
      const del = e.target.closest('[data-del]');
      if (del) { mnAskDelete = del.dataset.del; mnFill(); return; }
      if (e.target.closest('[data-del-no]')) { mnAskDelete = null; mnFill(); return; }
      const yes = e.target.closest('[data-del-yes]');
      if (yes) { mnDeleteRecipe(yes.dataset.delYes); return; }
      const b = e.target.closest('[data-r]'); if (!b) return;
      const m = mnMeal(mnCur.ds, mnCur.moment), i = m ? m.plats.findIndex(p=>mnLow(p) === mnLow(b.dataset.r)) : -1;
      if (i >= 0 && !b.classList.contains('new')) mnRemoveDish(i); else mnAddDish(b.dataset.r);   // toucher = ajouter / retirer
    });
    mnEl.who.addEventListener('click', e=>{ const b = e.target.closest('[data-p]'); if (b) mnToggleEater(b.dataset.p); });
    sheet.querySelector('[data-act="days"]').addEventListener('click', mnStartCopy);
    sheet.querySelector('[data-act="week"]').addEventListener('click', mnCopyWeek);
    bar.querySelector('button').addEventListener('click', ()=>mnStopCopy(false));
    // Téléphone : fermer en tirant la fenêtre vers le bas depuis son haut
    let drag = null;
    sheet.addEventListener('touchstart', e=>{
      drag = null;
      if (e.touches.length !== 1 || sheet.scrollTop > 0 || e.target.closest('input, button, .mn-recipes')) return;
      drag = { y:e.touches[0].clientY, dy:0, live:false };
    }, { passive:true });
    sheet.addEventListener('touchmove', e=>{
      if (!drag) return;
      const dy = e.touches[0].clientY - drag.y;
      if (!drag.live) { if (dy > 8) { drag.live = true; sheet.classList.add('dragging'); } else if (dy < -4) { drag = null; return; } else return; }
      drag.dy = Math.max(0, dy); sheet.style.transform = `translateY(${drag.dy}px)`;
      if (e.cancelable) e.preventDefault();
    }, { passive:false });
    const end = ()=>{ if (!drag) return; const d = drag; drag = null; sheet.classList.remove('dragging'); sheet.style.transform = ''; if (d.live && d.dy > 90) mnClose(); };
    sheet.addEventListener('touchend', end); sheet.addEventListener('touchcancel', end);
  }
  function mnOpen(ds, moment){
    if (!state.household) return;
    ensureMenuSheet();
    mnCur = { ds, moment };
    mnResetField();
    const d = new Date(ds + 'T00:00:00');
    mnEl.sheet.querySelector('.mn-date').textContent = d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
    mnFill();
    document.body.classList.add('mn-open');
    mnEl.sheet.scrollTop = 0;
    if (!state.menusReady) reloadMenus();
  }
  function mnResetField(){ if (mnEl.search) mnEl.search.value = ''; mnTyped = false; mnAskDelete = null; }
  // OK : un plat écrit dans le champ (et pas encore ajouté) est ajouté au repas
  function mnOk(){
    if (mnCur) { const v = mnEl.search.value.trim(); if (v) mnAddDish(v); }
    mnClose();
  }
  async function mnDeleteRecipe(id){
    const r = (state.recettes || []).find(x=>x.id === id);
    mnAskDelete = null;
    if (!r) { mnFill(); return; }
    state.recettes = state.recettes.filter(x=>x !== r);
    mnFill();
    mnToast(`« ${r.nom} » retiré de la liste (les repas déjà prévus restent)`);
    const { error } = await sb.from('recettes').delete().eq('id', id);
    if (error) mnFail(error);
  }
  function mnClose(){
    if (!mnEl.sheet) return;
    document.body.classList.remove('mn-open');
    if (document.activeElement && mnEl.sheet.contains(document.activeElement)) document.activeElement.blur();
    mnCur = null;
    render();
  }
  function mnFill(){
    if (!mnEl.sheet || !mnCur) return;
    const m = mnMeal(mnCur.ds, mnCur.moment);
    mnEl.sheet.querySelectorAll('.mn-tab').forEach(t=>t.classList.toggle('on', t.dataset.m === mnCur.moment));
    // Les plats du repas, en étiquettes
    mnEl.dishes.innerHTML = m && m.plats.length
      ? m.plats.map((p,i)=>`<span class="mn-chip"><button type="button" class="mn-chip-t" data-edit="${i}" aria-label="Corriger ${escapeAttr(p)}">${escapeHtml(p)}</button><button type="button" class="mn-chip-x" data-rm="${i}" aria-label="Retirer ${escapeAttr(p)}">✕</button></span>`).join('')
      : `<span class="mn-nodish">Pas encore de plat</span>`;
    const inMeal = new Set((m ? m.plats : []).map(mnLow));
    const q = mnTyped ? mnEl.search.value.trim() : '', ql = mnLow(q);
    let list = (state.recettes || []).slice().sort((a,b)=>(b.nb - a.nb) || a.nom.localeCompare(b.nom, 'fr'));   // du plus fait au moins fait
    if (ql) list = list.filter(r=>mnLow(r.nom).includes(ql));
    const exact = ql && (state.recettes || []).some(r=>mnLow(r.nom) === ql);
    mnEl.sheet.querySelector('.mn-lab-rc').textContent = ql ? 'Recettes trouvées' : 'Mes recettes (les plus faites en haut) · toucher = ajouter / retirer';
    mnEl.recipes.innerHTML = (ql && !exact ? `<button type="button" class="mn-ri new" data-r="${escapeAttr(q)}"><span>+ Ajouter « ${escapeHtml(q)} »</span></button>` : '')
      + list.map(r=> mnAskDelete === r.id
          ? `<div class="mn-ri ask"><span>Retirer « ${escapeHtml(r.nom)} » de la liste ?</span><button type="button" class="no" data-del-no="1">Garder</button><button type="button" class="yes" data-del-yes="${r.id}">Retirer</button></div>`
          : `<div class="mn-ri${inMeal.has(mnLow(r.nom)) ? ' on' : ''}"><button type="button" class="mn-rn" data-r="${escapeAttr(r.nom)}">${inMeal.has(mnLow(r.nom)) ? '<b class="mn-ck">✓</b>' : ''}<span>${escapeHtml(r.nom)}</span><small>${r.nb > 1 ? r.nb + ' fois' : ''}</small></button><button type="button" class="mn-rdel" data-del="${r.id}" aria-label="Retirer ${escapeAttr(r.nom)} de la liste">✕</button></div>`).join('')
      + (!list.length && !ql ? `<span class="mn-empty">Écris le nom d'un plat ci-dessus : il rejoindra tes recettes.</span>` : '');
    const eaters = mnEaters();
    const who = m ? m.mangeurs : eaters.map(p=>p.id);
    mnEl.who.innerHTML = eaters.map(p=>`<button type="button" class="mn-pp${who.includes(p.id) ? '' : ' off'}${m ? '' : ' wait'}" data-p="${p.id}"><span class="d" style="background:${p.color}">✓</span>${escapeHtml(p.name)}</button>`).join('');
    mnEl.sheet.querySelector('[data-act="days"]').disabled = !m;
    mnEl.sheet.querySelector('.mn-clear').disabled = !m;
  }

  /* ---------- Écritures ---------- */
  function mnToast(msg){
    ensureMenuSheet();
    mnEl.toast.textContent = msg; mnEl.toast.classList.add('show');
    clearTimeout(mnToast.t); mnToast.t = setTimeout(()=>mnEl.toast.classList.remove('show'), 2600);
  }
  function mnFail(err){ mnToast('Pas enregistré : ' + ((err && err.message) || 'connexion ?')); reloadMenus(); }
  // Enregistre un repas ; sans plat, il est supprimé
  async function mnSave(ds, moment, plats, mangeurs){
    if (!plats.length) return mnDelete(ds, moment);
    const k = mnKey(ds, moment);
    state.repas[k] = { id:(state.repas[k] && state.repas[k].id) || null, jour:ds, moment, plats, mangeurs };
    const plat = plats.join(' + ').slice(0, 120);   // ancienne colonne, gardée lisible
    const { error } = await sb.from('repas').upsert({ household_id:state.household.id, jour:ds, moment, plat, plats, mangeurs, updated_at:new Date().toISOString() }, { onConflict:'household_id,jour,moment' });
    if (error) mnFail(error);
  }
  async function mnDelete(ds, moment){
    delete state.repas[mnKey(ds, moment)];
    const { error } = await sb.from('repas').delete().eq('household_id', state.household.id).eq('jour', ds).eq('moment', moment);
    if (error) mnFail(error);
  }
  // Un plat ajouté à un repas : +1 à son compteur (créé s'il est nouveau)
  async function mnCountRecipe(nom){
    let r = (state.recettes || []).find(x=>mnLow(x.nom) === mnLow(nom));
    if (r) {
      r.nb += 1;
      const { error } = await sb.from('recettes').update({ nb_fois:r.nb }).eq('id', r.id);
      if (error) mnFail(error);
    } else {
      r = { id:uid(), nom, nb:1 }; state.recettes.push(r);
      const { error } = await sb.from('recettes').insert({ id:r.id, household_id:state.household.id, nom, nb_fois:1 });
      if (error) mnFail(error);
    }
  }
  function mnAddDish(raw){
    if (!mnCur) return;
    const nom = mnNice(raw); if (!nom) return;
    const old = mnMeal(mnCur.ds, mnCur.moment);
    const plats = old ? old.plats.slice() : [];
    if (!plats.some(p=>mnLow(p) === mnLow(nom))) { plats.push(nom); mnCountRecipe(nom); }
    mnSave(mnCur.ds, mnCur.moment, plats, old ? old.mangeurs : mnEaters().map(p=>p.id));
    mnEl.search.value = ''; mnTyped = false;
    mnFill();
  }
  function mnRemoveDish(i){
    const m = mnMeal(mnCur.ds, mnCur.moment); if (!m) return;
    // le plat retiré n'a pas été mangé : -1 à son compteur
    const r = (state.recettes || []).find(x=>mnLow(x.nom) === mnLow(m.plats[i]));
    if (r && r.nb > 0) { r.nb -= 1; sb.from('recettes').update({ nb_fois:r.nb }).eq('id', r.id).then(({ error })=>{ if (error) mnFail(error); }); }
    const plats = m.plats.filter((_,j)=>j !== i);
    mnSave(mnCur.ds, mnCur.moment, plats, m.mangeurs);
    mnFill();
  }
  function mnToggleEater(pid){
    const m = mnMeal(mnCur.ds, mnCur.moment);
    if (!m) { mnToast("Choisis d'abord un plat"); return; }
    const w = m.mangeurs.includes(pid) ? m.mangeurs.filter(x=>x!==pid) : m.mangeurs.concat(pid);
    mnSave(mnCur.ds, mnCur.moment, m.plats, w); mnFill();
  }
  function mnClear(){
    if (!mnCur || !mnMeal(mnCur.ds, mnCur.moment)) return;
    mnDelete(mnCur.ds, mnCur.moment); mnClose();
  }

  /* ---------- Recopier ---------- */
  function mnStartCopy(){
    const m = mnCur && mnMeal(mnCur.ds, mnCur.moment); if (!m) return;
    mnCopy = { moment:mnCur.moment, plats:m.plats.slice(), mangeurs:m.mangeurs.slice(), days:new Set() };
    mnEl.bar.querySelector('span').textContent = `« ${m.plats.join(' + ')} » (${mnCur.moment === 'midi' ? 'midi' : 'soir'}) : touche les jours`;
    mnEl.bar.hidden = false; document.body.classList.add('mn-copying');
    mnClose();
  }
  function mnToggleCopyDay(ds){
    const c = mnCopy;
    if (c.days.has(ds)) { c.days.delete(ds); mnDelete(ds, c.moment); }
    else { c.days.add(ds); mnSave(ds, c.moment, c.plats.slice(), c.mangeurs.slice()); c.plats.forEach(mnCountRecipe); }
    render();
  }
  function mnStopCopy(silent){
    if (!mnCopy) return;
    const n = mnCopy.days.size; mnCopy = null;
    if (mnEl.bar) mnEl.bar.hidden = true;
    document.body.classList.remove('mn-copying');
    if (!silent) { render(); if (n) mnToast(`Recopié sur ${n} jour${n>1?'s':''}`); }
  }
  // La semaine (lundi → dimanche) du jour ouvert reprend les repas de la semaine d'avant, sans rien écraser
  function mnCopyWeek(){
    if (!mnCur) return;
    const md = mondayOf(mnCur.ds), mon = dstr(md.getFullYear(), md.getMonth(), md.getDate()); let n = 0;   // mondayOf renvoie une date, pas un texte
    for (let i = 0; i < 7; i++) {
      const ds = addDays(mon, i), src = addDays(ds, -7);
      ['midi','soir'].forEach(k=>{
        const s = mnMeal(src, k);
        if (s && !mnMeal(ds, k)) { mnSave(ds, k, s.plats.slice(), s.mangeurs.slice()); s.plats.forEach(mnCountRecipe); mnFlash.add(ds); n++; }
      });
    }
    mnClose();
    mnToast(n ? `${n} repas repris de la semaine d'avant` : "Rien à reprendre : cette semaine est déjà remplie, ou celle d'avant est vide");
    if (n) setTimeout(()=>{ mnFlash.clear(); if (menuModeOn()) render(); }, 2500);
  }
  document.addEventListener('keydown', e=>{
    if (e.key !== 'Escape') return;
    if (document.body.classList.contains('mn-open')) mnClose();
    else if (mnCopy) mnStopCopy(false);
  });

  /* ---------- 3.2 : mode gaucher (par appareil) ---------- */
  try { if (localStorage.getItem('es-left-hand') === '1') document.body.classList.add('left-hand'); } catch(e){}

  /* ---------- 3.2 : bouton « retour » (Android, et flèche retour du navigateur) ---------- */
  // Tant qu'une fenêtre est ouverte, on garde une étape dans l'historique : « retour » ferme la fenêtre du dessus
  // au lieu de quitter EarthShade. Quand plus rien n'est ouvert, « retour » fait son travail habituel.
  let esBackIgnore = 0;
  function esLayerOpen(){
    return !!(view.sheet || view.selectMode || document.querySelector('body > .scrim') ||
              document.body.classList.contains('lists-open') || document.body.classList.contains('mn-open') ||
              (typeof mnCopy !== 'undefined' && mnCopy));
  }
  function esBackSync(){
    try {
      const marked = !!(history.state && history.state.es);
      if (esLayerOpen() && !marked) history.pushState({ es:1 }, '');
      else if (!esLayerOpen() && marked) { esBackIgnore++; history.back(); }
    } catch(e){}
  }
  window.addEventListener('popstate', ()=>{
    if (esBackIgnore > 0) { esBackIgnore--; return; }
    const small = document.querySelector('body > .scrim');          // petite fenêtre (heure, lieu…)
    if (small) small.remove();
    else if (document.body.classList.contains('mn-open')) mnClose();
    else if (typeof mnCopy !== 'undefined' && mnCopy) mnStopCopy(false);
    else if (document.body.classList.contains('lists-open')) closeLists();
    else if (view.sheet === 'form') { stashFormFields(); closeForm(); }
    else if (view.sheet === 'linkform') { view.sheet = 'links'; render(); }
    else if (view.sheet) { view.sheet = null; render(); }
    else if (view.selectMode) { view.selectMode = false; view.selectedDays = []; render(); }
    setTimeout(esBackSync, 0);   // s'il reste quelque chose d'ouvert, on remet une étape
  });
  setInterval(esBackSync, 400);   // filet de sécurité : fenêtres ouvertes en dehors du dessin principal

  /* ---------- 3.3 : rappels envoyés par EarthShade (notifications) ---------- */
  function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
  function b64ToBytes(str){
    const pad = '='.repeat((4 - str.length % 4) % 4);
    const bin = atob((str + pad).replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from(bin, c=>c.charCodeAt(0));
  }
  async function pushCurrentSub(){
    try { const reg = await navigator.serviceWorker.getRegistration(); return reg ? await reg.pushManager.getSubscription() : null; }
    catch(e){ return null; }
  }
  async function swReady(){
    let reg = null;
    try { reg = await navigator.serviceWorker.getRegistration(); } catch(e){}
    if (!reg) { try { await navigator.serviceWorker.register('sw.js'); } catch(e){} }
    return await Promise.race([
      navigator.serviceWorker.ready,
      new Promise((_, rej)=>setTimeout(()=>rej(new Error("L'appli n'est pas encore prête. Ferme-la, rouvre-la, puis réessaie.")), 10000))
    ]);
  }
  async function pushSave(sub){
    const j = sub.toJSON();
    const hh = (state.myProfile && state.myProfile.household_id) || (state.household && state.household.id);
    const { error } = await sb.from('push_abonnements').upsert({
      household_id: hh, profile_id: state.myProfile.id, endpoint: j.endpoint,
      p256dh: j.keys.p256dh, auth: j.keys.auth, appareil: navigator.userAgent.slice(0, 180)
    }, { onConflict: 'endpoint' });
    if (error) throw new Error(error.message);
  }
  async function pushEnable(){
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error("Notifications refusées. Autorise-les pour EarthShade dans les réglages du téléphone.");
    const reg = await swReady();
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const { data, error } = await sb.functions.invoke('rappels', { body: { action: 'cle' } });
      if (error || !data || !data.cle) throw new Error((data && data.error) || "Le service des rappels ne répond pas. Réessaie dans un moment.");
      try { sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(data.cle) }); }
      catch(e){ throw new Error("Le téléphone a refusé l'abonnement aux rappels (" + (e.message || e) + ")."); }
    }
    await pushSave(sub);
  }
  async function pushDisable(){
    const sub = await pushCurrentSub();
    if (!sub) return;
    try { await sb.from('push_abonnements').delete().eq('endpoint', sub.endpoint); } catch(e){}
    try { await sub.unsubscribe(); } catch(e){}
  }
  let pushBusy = false;
  async function renderPushBox(box){
    if (!box) return;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (!pushSupported()) {
      box.innerHTML = `<div class="push-row"><span>🔔 Rappels sur ce téléphone<small>${isIOS
        ? "Sur iPhone : installe d'abord EarthShade sur l'écran d'accueil (Partager → Sur l'écran d'accueil), puis ouvre-le depuis son icône."
        : "Ce navigateur ne peut pas recevoir de rappels."}</small></span></div>`;
      return;
    }
    const sub = await pushCurrentSub();
    const on = !!sub && Notification.permission === 'granted';
    if (on) { pushSave(sub).catch(()=>{}); }   // garde l'abonnement à jour côté Supabase
    const denied = Notification.permission === 'denied';
    const note = denied ? "Bloqués dans les réglages du téléphone : autorise les notifications pour EarthShade, puis réessaie."
      : on ? 'Activés : tes rappels arrivent sur ce téléphone.' : 'Désactivés';
    box.innerHTML = `<div class="push-row"><span>🔔 Rappels sur ce téléphone<small>${note}</small></span>`
      + `<button type="button" class="push-switch" id="push-switch" role="switch" aria-checked="${on}" aria-label="Rappels sur ce téléphone"${pushBusy ? ' disabled' : ''}></button></div>`
      + (on ? '<button class="ghost-btn" id="push-test-btn">Envoyer un rappel de test</button>' : '');
    box.querySelector('#push-switch').onclick = async ()=>{
      if (pushBusy) return;
      pushBusy = true; box.querySelector('#push-switch').disabled = true;
      try {
        if (on) { await pushDisable(); toast('Rappels désactivés sur ce téléphone.'); }
        else { await pushEnable(); toast('Rappels activés sur ce téléphone.'); }
      } catch(e){ toast(e.message || 'Impossible de changer le réglage.'); }
      pushBusy = false;
      renderPushBox(box);
    };
    const t = box.querySelector('#push-test-btn');
    if (t) t.onclick = async ()=>{
      t.disabled = true; t.textContent = 'Envoi…';
      try {
        const { data, error } = await sb.functions.invoke('rappels', { body: { action: 'test' } });
        if (error || !data || !data.ok) throw new Error((data && data.error) || "Le service des rappels ne répond pas.");
        toast(data.envoyes ? 'Rappel de test envoyé : il arrive dans quelques secondes.' : "Le rappel n'a pas pu partir. Désactive puis réactive les rappels.");
      } catch(e){ toast(e.message || 'Envoi impossible.'); }
      t.disabled = false; t.textContent = 'Envoyer un rappel de test';
    };
  }
  function esOpenDay(ds){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(ds || '')) || !auth.session || !state.myProfile) return;
    const d = new Date(ds + 'T00:00:00');
    view.year = d.getFullYear(); view.month = d.getMonth();
    view.weekAnchor = ds; view.dayAnchor = ds;
    view.openDay = ds; view.sheet = 'day';
    render();
  }
  function esOpenDayFromUrl(){
    try {
      const ds = new URLSearchParams(location.search).get('jour');
      if (!ds) return;
      history.replaceState(history.state, '', location.pathname);
      esOpenDay(ds);
    } catch(e){}
  }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', (e)=>{
      if (e.data && e.data.type === 'es-open-day') esOpenDay(e.data.jour);
    });
  }

  async function boot(){
    render();
    const { data: { session } } = await sb.auth.getSession();
    auth.session = session; auth.loading = false;
    if (session) { try { await afterLogin(); } catch(e){} }
    if (session && location.search.includes('code=')) {
      const linked = await finishGoogleConnect();
      if (linked) { try { await reloadHouseholdData(); } catch(e){} }
    }
    render();
    esOpenDayFromUrl();   // 3.3 : toucher une notification ouvre le bon jour
    sb.auth.onAuthStateChange((event, session)=>{
      const hadSession = !!auth.session, hasSession = !!session;
      auth.session = session;
      if (!hadSession && !hasSession) return;
      if (session) {
        afterLogin().then(render).catch(()=>render());
      } else {
        if (rtChannel) { try { sb.removeChannel(rtChannel); } catch(e){} rtChannel = null; }
        if (listsOpen()) closeLists();
        document.body.classList.remove('mn-open'); mnStopCopy(true);
        state.household = null; state.myProfile = null; state.profiles = []; state.events = []; state.log = []; state.articles = []; state.articlesReady = null; state.repas = {}; state.recettes = []; state.menusReady = null;
        render();
      }
    });
  }
  boot();

  /* ---------- Clavier sur ordinateur (1.3) ---------- */
  // Flèches ← → : période précédente / suivante.
  // Ctrl+C (⌘C) : copie l'événement survolé. Ctrl+V (⌘V) : le colle sur le jour survolé
  // (ou sur les jours sélectionnés). ↺ annule, comme le reste.
  let hoverEventId = null, hoverDay = null, clipEvent = null, delBusy = false;
  document.addEventListener('mouseover', (e)=>{
    const t = e.target;
    if (!t || !t.closest) return;
    const evEl = t.closest('[data-eid]');
    hoverEventId = evEl ? evEl.dataset.eid : null;
    const dEl = t.closest('[data-ds]');
    hoverDay = dEl ? dEl.dataset.ds : null;
  });
  document.addEventListener('mouseleave', ()=>{ hoverEventId = null; hoverDay = null; });

  async function pasteEvent(src, days){
    const list = [...new Set(days)];
    snapshot();
    try {
      const ids = [];
      for (const ds of list) {
        const id = uid();
        await upsertEventDb({ id, title: src.title, date: ds, start: src.start, end: src.end, icon: src.icon||'', reminder: src.reminder ?? null, important: !!src.important, lieu: src.lieu || '', participants: [...src.participants] });
        ids.push(id);
      }
      await logActivity(list.length > 1 ? `a collé « ${src.title} » sur ${list.length} jours` : `a collé « ${src.title} »`);
      await reloadHouseholdData();
      ids.forEach(id=>syncToGoogle('push', { event_id: id }));
      if (view.selectMode) { view.selectMode = false; view.selectedDays = []; }
      const lab = list.length > 1 ? `${list.length} jours` : new Date(list[0]+'T00:00:00').toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
      toast(`« ${src.title} » collé : ${lab} — ↺ pour annuler`);
    } catch(err){
      await reloadHouseholdData().catch(()=>{});
      alert('Collage impossible : ' + ((err && err.message) || 'erreur inconnue'));
    }
    render();
  }

  document.addEventListener('keydown', (e)=>{
    if (!auth.session || !state.myProfile) return;
    const t = e.target;
    const typing = t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='SELECT' || t.isContentEditable);
    if (typing) return;
    const sheetOpen = !!document.querySelector('.scrim');
    const mod = e.ctrlKey || e.metaKey;
    const k = (e.key || '').toLowerCase();

    if (!mod && !e.altKey && !e.shiftKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      if (sheetOpen) return;
      e.preventDefault();
      if (e.key === 'ArrowLeft') navPrev(); else navNext();
      return;
    }
    // 1.3.6 : Suppr (ou Retour arrière) supprime l'événement survolé ou ouvert, sans confirmation.
    // ↺ / Ctrl+Z pour annuler. Événement d'agenda lié : masqué. Sélection multiple : comme la corbeille.
    if (!mod && !e.altKey && (e.key === 'Delete' || e.key === 'Backspace')) {
      if (document.querySelector('body > .scrim')) return; // petite fenêtre (heure, lieu) ouverte
      if (sheetOpen && view.sheet !== 'day' && view.sheet !== 'form') return;
      e.preventDefault();
      if (e.repeat || delBusy) return;
      if (!sheetOpen && view.selectMode) {
        if (!view.selectedDays.length) { toast('Sélectionne des jours, ou survole un événement, puis Suppr.'); return; }
        delBusy = true;
        removeEventsOnDays([...view.selectedDays]).finally(()=>{ delBusy = false; });
        return;
      }
      const formEv = (view.sheet === 'form' && view.editingEvent && !view._bulkDates) ? view.editingEvent : null;
      let ev = hoverEventId && state.events.find(x=>x.id===hoverEventId);
      if (!ev && formEv) ev = state.events.find(x=>x.id===formEv.id);
      if (!ev) { toast('Survole un événement avec la souris (ou ouvre-le), puis Suppr.'); return; }
      delBusy = true;
      hoverEventId = null;
      const wasLinked = isLinked(ev);
      removeEvent(ev).then(()=>{
        if (!wasLinked && !state.events.some(x=>x.id===ev.id)) toast(`« ${ev.title} » supprimé — ↺ pour annuler`);
        if (view.sheet === 'form') view.sheet = (view._formFrom === 'day') ? 'day' : null;
        render();
      }).finally(()=>{ delBusy = false; });
      return;
    }
    // Ctrl+Z (⌘Z) : même chose que le bouton ↺
    if (mod && !e.altKey && !e.shiftKey && k === 'z') {
      if (sheetOpen && view.sheet !== 'day') return;
      e.preventDefault();
      if (!state._undoStack.length) { toast('Rien à annuler.'); return; }
      undo();
      return;
    }
    // Copier-coller : calendrier, fenêtre du jour, ou formulaire d'un événement ouvert
    if (!mod || e.altKey || e.shiftKey) return;
    if (sheetOpen && view.sheet !== 'day' && view.sheet !== 'form') return;
    const formEv = (view.sheet === 'form' && view.editingEvent) ? view.editingEvent : null;
    const formIsExisting = !!(formEv && state.events.some(x=>x.id===formEv.id));
    if (k === 'c') {
      if (window.getSelection && String(window.getSelection())) return; // texte sélectionné : copie normale
      let ev = hoverEventId && state.events.find(x=>x.id===hoverEventId);
      // Événement ouvert (on a cliqué dessus) : c'est lui qu'on copie
      if (!ev && formIsExisting) ev = state.events.find(x=>x.id===formEv.id);
      if (!ev) { e.preventDefault(); toast('Survole un événement avec la souris (ou ouvre-le), puis Ctrl+C.'); return; }
      e.preventDefault();
      clipEvent = { title: ev.title, start: ev.start, end: ev.end, icon: ev.icon, reminder: ev.reminder, important: ev.important, lieu: ev.lieu, participants: [...ev.participants] };
      toast(`« ${ev.title} » copié — survole un jour puis Ctrl+V`);
    } else if (k === 'v') {
      if (!clipEvent) { e.preventDefault(); toast("Rien à coller : copie d'abord un événement (Ctrl+C)."); return; }
      let days = [];
      if (view.selectMode && view.selectedDays.length) days = [...view.selectedDays];
      else if (hoverDay) days = [hoverDay];
      else if (view.sheet === 'form' && view._bulkDates && view._bulkDates.length) days = [...view._bulkDates];
      else if (formEv && !formIsExisting) days = [formEv.date]; // on a cliqué sur un jour vide
      else if (view.sheet === 'day' && view.openDay) days = [view.openDay];
      else if (view.mode === 'day') days = [view.dayAnchor || todayStr()];
      e.preventDefault();
      if (!days.length) { toast('Survole un jour avec la souris, puis Ctrl+V.'); return; }
      if (view.sheet === 'form') view.sheet = null; // le collage remplace la saisie en cours
      pasteEvent(clipEvent, days);
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
