
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>EarthShade</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#23262B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EarthShade">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Karla:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF2F5;
    --surface: #FFFFFF;
    --surface-soft: #F5F7F9;
    --ink: #23262B;
    --ink-soft: #6B7280;
    --line: #DDE3E8;
    --shadow: 0 1px 2px rgba(35,38,43,.06), 0 4px 14px rgba(35,38,43,.06);
    --palette-1: #3B6EA5; --palette-2: #E8735C; --palette-3: #3FA796;
    --palette-4: #C4547A; --palette-5: #D9A441; --palette-6: #6A5DAD;
    --tint: 22%;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg:#171A1E; --surface:#21252B; --surface-soft:#262B32; --ink:#ECEEF1; --ink-soft:#9AA1AB; --line:#33393F;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
      --tint: 35%;
    }
  }
  :root[data-theme="dark"] {
    --bg:#171A1E; --surface:#21252B; --surface-soft:#262B32; --ink:#ECEEF1; --ink-soft:#9AA1AB; --line:#33393F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
    --tint: 35%;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; overflow-x:hidden; width:100%; }
  body { background: var(--bg); color: var(--ink); font-family:'Karla',sans-serif; min-height:100vh; -webkit-tap-highlight-color:transparent; }
  h1,h2,h3,.display { font-family:'Quicksand',sans-serif; }
  #app { max-width:640px; width:100%; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden; }

  #onboarding { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; text-align:center; gap:18px; }
  #onboarding .icon { font-size:40px; }
  #onboarding h1 { font-size:24px; font-weight:700; margin:0; }
  #onboarding p { color:var(--ink-soft); margin:0; max-width:320px; line-height:1.5; }
  .field { width:100%; max-width:320px; text-align:left; }
  .field label { display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px; font-weight:600; }
  .field input[type="text"], .field input[type="password"] { width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); font-family:'Karla',sans-serif; font-size:16px; }
  .field input[type="text"]:focus, .field input[type="password"]:focus { outline:2px solid var(--palette-1); outline-offset:1px; }
  .swatches { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .swatch { width:34px; height:34px; border-radius:50%; border:3px solid transparent; cursor:pointer; }
  .swatch.selected { border-color:var(--ink); }
  .btn-primary { width:100%; max-width:320px; padding:13px; border-radius:12px; border:none; cursor:pointer; background:var(--ink); color:var(--surface); font-family:'Quicksand',sans-serif; font-weight:700; font-size:16px; }
  .btn-primary:disabled { opacity:.4; cursor:not-allowed; }

  header { display:flex; align-items:center; justify-content:space-between; padding:10px 8px; gap:4px; position:sticky; top:0; background:var(--bg); z-index:5; flex-shrink:0; }
  .month-nav { display:flex; align-items:center; gap:0; flex:1; min-width:0; }
  .month-nav button { flex-shrink:0; background:none; border:none; color:var(--ink); font-size:16px; padding:5px 5px; cursor:pointer; border-radius:8px; }
  .month-nav button:hover { background:var(--surface-soft); }
  .month-title { font-size:15px; font-weight:700; flex:1; min-width:0; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .header-actions { display:flex; align-items:center; gap:3px; flex-shrink:0; }
  .icon-btn { width:30px; height:30px; border-radius:50%; border:none; background:var(--surface); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:12px; color:var(--ink); flex-shrink:0; }
  .icon-btn.active { background:var(--ink); color:var(--surface); }
  .avatar { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-family:'Quicksand',sans-serif; cursor:pointer; border:none; font-size:12px; flex-shrink:0; }

  .legend { display:flex; gap:8px; padding:0 16px 10px; flex-wrap:wrap; flex-shrink:0; }
  .legend-chip { display:flex; align-items:center; gap:6px; padding:5px 10px 5px 6px; border-radius:999px; background:var(--surface); box-shadow:var(--shadow); font-size:13px; cursor:pointer; border:none; color:var(--ink); font-family:'Karla',sans-serif; font-weight:600; }
  .legend-chip.off { opacity:.35; }
  .dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  .select-bar { margin:0 16px 10px; padding:10px 12px; border-radius:12px; background:var(--surface); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13.5px; font-weight:600; flex-shrink:0; }
  .select-bar button { background:none; border:none; color:var(--palette-2); font-weight:700; font-size:13px; cursor:pointer; }

  .weekdays { display:grid; grid-template-columns: repeat(7, minmax(0,1fr)); padding:0 16px; margin-bottom:4px; }
  .weekdays span { text-align:center; font-size:11px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .grid { display:grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap:5px; padding:0 16px 100px; }
  .day-cell { background:var(--surface); border-radius:12px; min-height:98px; min-width:0; overflow:hidden; padding:5px 4px; display:flex; flex-direction:column; gap:2px; cursor:pointer; border:1.5px solid transparent; box-shadow:var(--shadow); position:relative; }
  .day-cell.other-month { opacity:.4; }
  .day-cell.today { border-color:var(--ink); }
  .day-cell.picked { border-color:var(--palette-3); background: color-mix(in srgb, var(--palette-3) 12%, var(--surface)); }
  .pick-mark { position:absolute; top:4px; right:4px; width:16px; height:16px; border-radius:50%; background:var(--palette-3); color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; }
  .day-num { font-size:12px; font-weight:700; padding-left:2px; }
  /* Événements marqués « Important » : double liseré + étoile */
  .imp-mark { color:#F2C14E; margin-right:3px; }
  .ev-line.imp { border:2px solid var(--ink); }
  .ev-line.imp .imp-mark { color:var(--ink); margin-right:2px; }
  .day-num .imp-day { color:#C99A1E; font-size:.8em; margin-left:2px; }
  .event-row.imp { position:relative; box-shadow:0 0 0 2.5px var(--surface), 0 0 0 5px var(--ink); margin:12px 6px 14px; }
  .imp-badge { position:absolute; top:-10px; right:-10px; width:26px; height:26px; border-radius:50%; background:#F2C14E; border:2.5px solid var(--surface); color:#23262B; display:flex; align-items:center; justify-content:center; font-size:13px; line-height:1; pointer-events:none; }
  .tl-ev.imp { box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--ink); z-index:3; overflow:visible; }
  .allday-chip.imp { box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
  .ev-line { height:17px; line-height:14px; border-radius:6px; padding:0 4px; font-size:9.5px; font-weight:700; color:var(--ink); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; border:1.6px solid transparent; }
  .ev-line-text { display:inline-block; white-space:nowrap; }
  .ev-line.marquee { text-overflow:clip; }
  .ev-line.marquee .ev-line-text { animation: evMarquee var(--marquee-dur,6s) ease-in-out infinite; }
  @keyframes evMarquee {
    0%, 15% { transform: translateX(0); }
    50%, 60% { transform: translateX(var(--marquee-dist,0)); }
    90%, 100% { transform: translateX(0); }
  }
  .more { font-size:9.5px; color:var(--ink-soft); padding-left:2px; font-weight:600; }

  .fab-row { position:fixed; bottom:22px; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:0 24px; gap:14px; z-index:10; pointer-events:none; }
  .fab-row > * { pointer-events:auto; }
  .fab { width:58px; height:58px; border-radius:50%; background:var(--ink); color:var(--surface); border:none; font-size:26px; box-shadow:0 6px 18px rgba(0,0,0,.25); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .fab.apply { background:var(--palette-3); font-size:15px; width:auto; padding:0 22px; font-family:'Quicksand',sans-serif; font-weight:700; }
  .fab-undo { width:58px; height:58px; border-radius:50%; background:var(--surface); color:var(--ink); border:none; font-size:24px; box-shadow:0 4px 12px rgba(0,0,0,.15); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .fab-undo:disabled { opacity:.3; cursor:not-allowed; }
  .view-toggle-wrap { position:relative; flex-shrink:0; }
  .fab-view { width:58px; height:58px; border-radius:50%; background:var(--surface); color:var(--ink); border:none; font-size:20px; font-weight:700; font-family:'Quicksand',sans-serif; box-shadow:0 4px 12px rgba(0,0,0,.15); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .view-menu { position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; align-items:center; }
  .view-opt { width:46px; height:46px; border-radius:50%; background:var(--surface); color:var(--ink); border:none; font-size:16px; font-weight:700; font-family:'Quicksand',sans-serif; box-shadow:0 4px 12px rgba(0,0,0,.18); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .view-opt.active { background:var(--ink); color:var(--surface); }

  .scrim { position:fixed; inset:0; background:rgba(20,22,26,.42); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .scrim.center { align-items:center; padding:16px; }
  .sheet { background:var(--surface); width:100%; max-width:640px; border-radius:20px 20px 0 0; max-height:86vh; overflow-y:auto; padding:18px 18px 28px; }
  .scrim.center .sheet { border-radius:20px; max-height:88vh; }
  .sheet-handle { width:36px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 14px; }
  .sheet-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .sheet-header h2 { margin:0; font-size:18px; }
  .sheet-close { background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; padding:4px; }

  .event-row { display:flex; align-items:center; gap:10px; padding:10px 8px; border-radius:12px; margin-bottom:6px; color:#fff; }
  .event-info { flex:1; min-width:0; }
  .event-plate { display:inline-block; max-width:100%; background:rgba(14,16,19,.58); border-radius:9px; padding:5px 10px; }
  .event-title { font-weight:700; font-size:14.5px; color:#fff; }
  .event-meta { font-size:12px; color:rgba(255,255,255,.88); }
  .event-del { background:none; border:none; color:rgba(255,255,255,.85); font-size:16px; cursor:pointer; padding:4px 6px; }
  .empty-note { color:var(--ink-soft); font-size:14px; text-align:center; padding:18px 0; }
  .toast { position:fixed; left:50%; bottom:96px; transform:translate(-50%, 14px); z-index:40;
           max-width:min(92vw,520px); background:var(--ink); color:var(--surface);
           font-size:13.5px; font-weight:600; padding:11px 16px; border-radius:12px;
           box-shadow:0 6px 20px rgba(0,0,0,.3); opacity:0; pointer-events:none;
           transition:opacity .18s ease, transform .18s ease; text-align:center; }
  .toast.show { opacity:1; transform:translate(-50%, 0); }

  .form-row { margin-bottom:14px; }
  .form-row label { display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .form-row input, .form-row select { width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); font-family:'Karla',sans-serif; font-size:15px; }
  .time-row { display:flex; gap:10px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { padding:8px 13px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); font-size:13.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; color:var(--ink); }
  .chip.on { border-color:transparent; color:#fff; }
  .preset-row { display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; margin-bottom:4px; }
  .preset { flex-shrink:0; padding:7px 12px; border-radius:10px; background:var(--surface-soft); border:none; font-size:12.5px; font-weight:700; color:var(--ink); cursor:pointer; }
  .bulk-note { background:var(--surface-soft); border-radius:10px; padding:10px 12px; font-size:13px; color:var(--ink-soft); margin-bottom:14px; }
  .reminder-note { font-size:12px; color:var(--ink-soft); margin-top:7px; }
  .section-sep { border:0; height:1px; background:linear-gradient(90deg, transparent, var(--line) 18%, var(--line) 82%, transparent); margin:26px 0 18px; }
  .section-title { font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 12px 2px; }
  .rem-badge { flex-shrink:0; font-size:11px; font-weight:700; color:#fff; background:rgba(16,18,21,.45); border-radius:999px; padding:3px 8px; white-space:nowrap; }

  .log-row { padding:10px 4px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .log-time { color:var(--ink-soft); font-size:12px; }

  .save-btn { width:100%; padding:13px; border-radius:12px; border:none; background:var(--ink); color:var(--surface); font-family:'Quicksand',sans-serif; font-weight:700; font-size:16px; cursor:pointer; margin-top:4px; }
  .save-btn:disabled { opacity:.5; cursor:not-allowed; }
  .who { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); }
  .who .avatar { cursor:default; }
  .switch-btn { margin-left:auto; background:none; border:1.5px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12.5px; cursor:pointer; color:var(--ink); font-weight:700; }
  .ghost-btn { width:100%; padding:12px; border-radius:12px; background:transparent; color:var(--ink); border:1.5px solid var(--line); font-family:'Quicksand',sans-serif; font-weight:700; font-size:15px; cursor:pointer; margin-top:10px; }
  .danger-btn { width:100%; padding:12px; border-radius:12px; background:transparent; color:var(--palette-4); border:1.5px solid var(--palette-4); font-family:'Quicksand',sans-serif; font-weight:700; font-size:15px; cursor:pointer; margin-top:10px; }
  .danger-btn:disabled { opacity:.5; cursor:not-allowed; }

  .time-field { width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); font-family:'Karla',sans-serif; font-size:16px; font-weight:700; text-align:left; cursor:pointer; }
  .wheel-frame { position:relative; margin: 4px 0 18px; }
  .wheel-picker { display:flex; align-items:center; justify-content:center; gap:2px; }
  .wheel-col { height:176px; width:76px; overflow-y:scroll; scroll-snap-type:y mandatory; padding:66px 0; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .wheel-col::-webkit-scrollbar { display:none; }
  .wheel-item { height:44px; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; font-family:'Quicksand',sans-serif; scroll-snap-align:center; color:var(--ink); transition:opacity .1s; }
  .wheel-colon { font-size:22px; font-weight:700; padding:0 2px; color:var(--ink); }
  .wheel-highlight { position:absolute; top:50%; left:0; right:0; height:44px; transform:translateY(-50%); border-top:1.5px solid var(--line); border-bottom:1.5px solid var(--line); pointer-events:none; }

  .shell { display:flex; flex-direction:column; flex:1; min-height:0; }
  .sidebar { display:none; }
  .main-col { display:flex; flex-direction:column; flex:1; min-width:0; min-height:0; }

  body.is-wide { height:100%; overflow:hidden; }
  body.is-wide #app { max-width:none; width:100%; height:100vh; height:100dvh; margin:0; overflow:hidden; }
  body.is-wide .shell { flex-direction:row; min-height:0; height:100%; overflow:hidden; }
  body.is-wide .sidebar { display:flex; flex-direction:column; align-items:center; gap:12px; width:76px; flex-shrink:0; padding:18px 0; background:var(--surface); box-shadow:var(--shadow); overflow-y:auto; }
  .side-item { display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; }
  .side-label { font-size:9.5px; color:var(--ink-soft); font-weight:700; text-align:center; max-width:60px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .side-item.active .side-label { color:var(--ink); }
  body.is-wide .main-col { flex:1; min-width:0; min-height:0; height:100%; display:flex; flex-direction:column; overflow:hidden; }
  body.is-wide header { padding:14px 28px 8px; flex-shrink:0; }
  body.is-wide header .header-actions { display:none; }
  body.is-wide .month-title { font-size:20px; }
  body.is-wide .legend, body.is-wide .select-bar { padding:0 28px 10px; flex-shrink:0; }
  body.is-wide .cal-wrap { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  body.is-wide .weekdays { flex-shrink:0; padding:0 28px; }
  body.is-wide .weekdays span { font-size:12.5px; }
  body.is-wide .grid { flex:1; min-height:0; display:grid; grid-auto-rows:1fr; gap:10px; padding:0 28px 20px; }
  body.is-wide .day-cell { min-height:0; height:100%; padding:10px 12px 8px; gap:5px; border-radius:14px; }
  body.is-wide .day-num { font-size:15px; }
  body.is-wide .ev-line { font-size:12.5px; height:25px; line-height:21px; border-radius:7px; padding:0 7px; border-width:2px; }
  body.is-wide .more { font-size:12px; }
  body.is-wide .fab-row { position:static; padding:8px 28px 16px; flex-shrink:0; }
  body.is-wide .fab, body.is-wide .fab-undo, body.is-wide .fab-view { width:48px; height:48px; font-size:21px; }
  body.is-wide .view-opt { width:38px; height:38px; font-size:14px; }
  body.is-wide .sheet, body.is-wide .scrim.center .sheet { max-width:460px; }

  .cal-viewport { position:relative; overflow:hidden; touch-action:pan-y; flex:1; min-height:0; }
  body.is-wide .cal-viewport { flex:1; min-height:0; display:flex; flex-direction:column; }

  body.day-mode:not(.is-wide) #app { height:100vh; height:100dvh; min-height:0; overflow:hidden; }
  .day-wrap { display:flex; flex-direction:column; height:100%; min-height:0; overflow:hidden; }
  .day-allday { flex-shrink:0; position:relative; display:flex; flex-wrap:wrap; gap:6px; padding:2px 12px 8px 58px; }
  .day-allday-lab { position:absolute; left:12px; top:9px; width:38px; text-align:right; font-size:10.5px; font-weight:700; color:var(--ink-soft); line-height:1.1; }
  .allday-chip { border-radius:10px; padding:3px; cursor:pointer; max-width:100%; }
  .day-scroll { --hh:32px; flex:1; min-height:0; overflow-y:auto; padding:0 12px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .day-scroll::after { content:''; display:block; height:80px; }
  body.is-wide .day-scroll::after { height:12px; }
  .tl { position:relative; }
  .tl-night { position:absolute; left:46px; right:0; top:0; background:var(--surface-soft); border-radius:6px 6px 0 0; }
  .tl-line { position:absolute; left:46px; right:0; height:0; border-top:1px solid var(--line); pointer-events:none; }
  .tl-line.edge { border-top-color: color-mix(in srgb, var(--ink-soft) 45%, var(--line)); }
  .tl-lab { position:absolute; left:0; width:38px; text-align:right; font-size:10.5px; font-weight:700; color:var(--ink-soft); line-height:1; transform:translateY(-50%); pointer-events:none; }
  .tl-lab.first { transform:none; }
  .tl-grid { position:absolute; left:46px; right:0; top:0; bottom:0; }
  .tl-ev { position:absolute; border-radius:8px; overflow:hidden; padding:2px; cursor:pointer; min-height:18px; box-shadow:0 0 0 1px var(--surface); }
  .tl-ev .event-plate { display:block; width:fit-content; max-width:100%; padding:2px 6px; border-radius:6px; overflow:hidden; }
  .tl-ev .event-title { font-size:12px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tl-ev .event-meta { font-size:11px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tl-ev.s { min-height:0; padding:0; border-radius:6px; }
  .tl-ev.s .event-plate { padding:0 5px; border-radius:5px; }
  .tl-ev.s .event-title { font-size:10.5px; line-height:12px; }
  .tl-now { position:absolute; left:-5px; right:0; height:0; border-top:2px solid #E5484D; z-index:3; pointer-events:none; }

  function startGoogleConnect(){
    const state_ = uid();
    try { sessionStorage.setItem('af_gstate', state_); } catch(e){}
    const params = new URLSearchParams({
      client_id: GOOGLE_CLIENT_ID,
      redirect_uri: appRedirectUri(),
      response_type: 'code',
      scope: 'https://www.googleapis.com/auth/calendar',
      access_type: 'offline',
      prompt: 'consent',
      state: state_
    });
    location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
  }

  async function finishGoogleConnect(){
    const url = new URL(location.href);
    const code = url.searchParams.get('code');
    const returnedState = url.searchParams.get('state');
    const oauthError = url.searchParams.get('error');
    if (!code && !oauthError) return false;

    history.replaceState({}, '', appRedirectUri());

    if (oauthError) { toast("Connexion Google annulée."); return false; }

    let expected = null;
    try { expected = sessionStorage.getItem('af_gstate'); sessionStorage.removeItem('af_gstate'); } catch(e){}
    if (!expected || expected !== returnedState) { toast("Retour Google inattendu, connexion abandonnée."); return false; }

    try {
      const { data, error } = await sb.functions.invoke('google-calendar', {
        body: { action:'connect', code, redirect_uri: appRedirectUri() }
      });
      if (error) throw error;
      if (data && data.error) throw new Error(data.error);
      toast('Google Agenda connecté' + (data && data.email ? ' (' + data.email + ')' : '') + '.');
      return true;
    } catch(err){
      toast('Connexion Google impossible : ' + ((err && err.message) || 'erreur inconnue'));
      return false;
    }
  }

  async function syncToGoogle(action, payload){
    if (!state.googleLinked) return;
    try {
      const { data, error } = await sb.functions.invoke('google-calendar', { body: { action, ...payload } });
      if (error) throw error;
      if (data && data.error) throw new Error(data.error);
    } catch(err){
      toast("L'événement est enregistré, mais Google Agenda n'a pas suivi.");
      console.warn('Synchronisation Google :', err);
    }
  }

  let toastTimer = null;
  function toast(msg){
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div'); el.id='toast'; el.className='toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ el.classList.remove('show'); }, 4200);
  }

  function snapshot(){
    state._undo = { events: JSON.parse(JSON.stringify(state.events)), log: JSON.parse(JSON.stringify(state.log)) };
  }
  async function undo(){
    if (!state._undo) return;
    const prevEvents = state._undo.events;
    const curEvents = state.events;
    const prevIds = new Set(prevEvents.map(e=>e.id));
    const toDelete = curEvents.filter(e=>!prevIds.has(e.id));
    const toRestore = prevEvents.filter(e=>{
      const cur = curEvents.find(c=>c.id===e.id);
      return !cur || JSON.stringify(cur)!==JSON.stringify(e);
    });
    const keptUndo = state._undo;
    state._undo = null;
    try {
      const googleIdsToDrop = toDelete.map(e=>e.googleId).filter(Boolean);
      for (const e of toDelete) await deleteEventDb(e.id);
      for (const e of toRestore) await upsertEventDb(e);
      await logActivity('a annulé la dernière action');
      await reloadHouseholdData();
      googleIdsToDrop.forEach(gid=>syncToGoogle('remove', { google_event_id: gid }));
      toRestore.forEach(e=>syncToGoogle('push', { event_id: e.id }));
    } catch(err){
      state._undo = keptUndo;
      alert("L'annulation n'a pas pu être enregistrée : " + ((err && err.message) || 'erreur inconnue') + "\nRéessaie dans un instant.");
    }
    render();
  }
  async function removeEvent(e){
    snapshot();
    const googleId = e.googleId;
    try {
      await deleteEventDb(e.id);
      await logActivity(`a supprimé « ${e.title} »`);
      await reloadHouseholdData();
      syncToGoogle('remove', { google_event_id: googleId });
    } catch(err){ alert('Erreur : '+err.message); }
  }
  function fmtTime(ts){
    const d = new Date(ts);
    return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) + ' à ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  }
  function dstr(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
  function stripeBg(colors){
    if (!colors.length) colors=['#999'];
    if (colors.length===1) return colors[0];
    const n = colors.length, step = 100/n, stops=[];
    colors.forEach((c,i)=>{ stops.push(`${c} ${(i*step).toFixed(2)}%`, `${c} ${((i+1)*step).toFixed(2)}%`); });
    return `linear-gradient(135deg, ${stops.join(', ')})`;
  }
  function pastelStripeBg(colors){
    if (!colors.length) colors=['#999'];
    const tinted = colors.map(c=>`color-mix(in srgb, ${c} var(--tint), var(--surface))`);
    if (tinted.length===1) return tinted[0];
    const n = tinted.length, step = 100/n, stops=[];
    tinted.forEach((c,i)=>{ stops.push(`${c} ${(i*step).toFixed(2)}%`, `${c} ${((i+1)*step).toFixed(2)}%`); });
    return `linear-gradient(135deg, ${stops.join(', ')})`;
  }
  function asLayer(bg){ return bg.startsWith('linear-gradient') ? bg : `linear-gradient(${bg}, ${bg})`; }
  function lineBg(colors){
    return `${asLayer(pastelStripeBg(colors))} padding-box, ${asLayer(stripeBg(colors))} border-box`;
  }
  function todayStr(){ const t=new Date(); return dstr(t.getFullYear(),t.getMonth(),t.getDate()); }

  function initMarquees(){
    requestAnimationFrame(()=>{
      document.querySelectorAll('.ev-line').forEach(line=>{
        const text = line.querySelector('.ev-line-text');
        if (!text) return;
        const overflow = text.scrollWidth - line.clientWidth;
        if (overflow > 2) {
          const dist = -(overflow + 4);
          line.style.setProperty('--marquee-dist', dist + 'px');
          const dur = Math.max(3.5, Math.abs(dist) / 16);
          line.style.setProperty('--marquee-dur', dur + 's');
          line.classList.add('marquee');
        } else {
          line.classList.remove('marquee');
        }
      });
    });
  }

  function headerLabel(){
    if (view.mode==='week') {
      const mon = mondayOf(view.weekAnchor || todayStr());
      const sun = new Date(mon); sun.setDate(mon.getDate()+6);
      const fmt = (d)=> d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0,3);
      return `${fmt(mon)} – ${fmt(sun)}`;
    }
    if (view.mode==='day') {
      const d = new Date((view.dayAnchor||todayStr())+'T00:00:00');
      return d.toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long'});
    }
    return `${MONTHS[view.month]} ${view.year}`;
  }
  function stepPrev(){
    if (view.mode==='week') { view.weekAnchor = addDays(view.weekAnchor||todayStr(), -7); }
    else if (view.mode==='day') { view.dayAnchor = addDays(view.dayAnchor||todayStr(), -1); }
    else { view.month--; if(view.month<0){view.month=11; view.year--;} }
  }
  function stepNext(){
    if (view.mode==='week') { view.weekAnchor = addDays(view.weekAnchor||todayStr(), 7); }
    else if (view.mode==='day') { view.dayAnchor = addDays(view.dayAnchor||todayStr(), 1); }
    else { view.month++; if(view.month>11){view.month=0; view.year++;} }
  }
  function navPrev(){ agendaScrollTop = null; stepPrev(); renderWithTransition('prev'); }
  function navNext(){ agendaScrollTop = null; stepNext(); renderWithTransition('next'); }
  let navBusy = false;
  function renderWithTransition(dir){
    const viewport = document.querySelector('.cal-viewport');
    const oldEl = viewport ? viewport.querySelector('.cal-wrap') : null;
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!viewport || !oldEl || reduceMotion || navBusy) { render(); return; }
    navBusy = true;

    const oldHeader = document.querySelector('header');
    if (oldHeader) oldHeader.replaceWith(renderHeader());
    const oldLegend = document.querySelector('.legend, .select-bar');
    if (oldLegend) oldLegend.replaceWith(renderLegend());

    const newEl = renderCalendar();
    const goingNext = dir === 'next';

    viewport.style.minHeight = viewport.offsetHeight + 'px';

    [oldEl, newEl].forEach(el=>{
      el.style.position = 'absolute';
      el.style.top = '0'; el.style.left = '0'; el.style.width = '100%';
    });
    newEl.style.transform = `translateX(${goingNext ? '100%' : '-100%'})`;
    viewport.appendChild(newEl);
    if (usesTimeline()) syncDayScroll(oldEl, [newEl]);
    initMarquees();

    void newEl.offsetWidth;

    const dur = '.22s'; const ease = 'cubic-bezier(.22,.61,.36,1)';
    oldEl.style.transition = `transform ${dur} ${ease}`;
    newEl.style.transition = `transform ${dur} ${ease}`;
    requestAnimationFrame(()=>{
      oldEl.style.transform = `translateX(${goingNext ? '-100%' : '100%'})`;
      newEl.style.transform = 'translateX(0)';
    });

    let cleaned = false;
    const cleanup = ()=>{
      if (cleaned) return; cleaned = true;
      oldEl.remove();
      newEl.style.position = ''; newEl.style.top = ''; newEl.style.left = ''; newEl.style.width = '';
      newEl.style.transform = ''; newEl.style.transition = '';
      viewport.style.minHeight = '';
      navBusy = false;
    };
    newEl.addEventListener('transitionend', cleanup, { once:true });
    setTimeout(cleanup, 320);
  }

      bar.innerHTML = `<span>${n ? n+' jour'+(n>1?'s':'')+' sélectionné'+(n>1?'s':'') : 'Touchez des jours à sélectionner'}</span>`;

      if (n) {
        const clearBtn = document.createElement('button'); clearBtn.className='sel-deselect';
        clearBtn.textContent='Désélectionner';
        clearBtn.onclick = ()=>{ view.selectedDays=[]; render(); };
        actions.appendChild(clearBtn);
      }
      const cancelBtn = document.createElement('button'); cancelBtn.textContent='Annuler';
      cancelBtn.onclick = ()=>{ view.selectMode=false; view.selectedDays=[]; render(); };
      actions.appendChild(cancelBtn);
      bar.appendChild(actions);
      return bar;
    }
    const wrap = document.createElement('div');
    wrap.className='legend';
    state.profiles.forEach(p=>{
      const off = state.hidden.includes(p.id);
      const chip = document.createElement('button');
      chip.className='legend-chip' + (off?' off':'');
      chip.innerHTML = `<span class="dot" style="background:${p.color}"></span>${p.name}`;
      chip.onclick = ()=>{
        if (off) state.hidden = state.hidden.filter(id=>id!==p.id);
        else state.hidden.push(p.id);
        persistHidden(); render();
      };
      wrap.appendChild(chip);
    });
    return wrap;
  }

  function compareEvents(a, b){
    const aa = !a.start, bb = !b.start;
    if (aa !== bb) return aa ? -1 : 1;
    const s = (a.start||'').localeCompare(b.start||'');
    if (s) return s;
    const dur = e=>{
      if (!e.start) return 0;
      const st = toMin(e.start);
      let en = e.end ? toMin(e.end) : st + 60;
      if (en <= st) en = 1440;
      return en - st;
    };
    return dur(b) - dur(a) || (a.title||'').localeCompare(b.title||'', 'fr');
  }
  function eventsFor(dateStr){
    return state.events
      .filter(e=>e.date===dateStr && e.participants.some(id=>!state.hidden.includes(id)))
      .sort(compareEvents);
  }
  function addDays(dateStr, n){
    const d = new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()+n);
    return dstr(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function mondayOf(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    const offset = (d.getDay()+6)%7;
    d.setDate(d.getDate()-offset);
    return d;
  }

  let ignoreClickUntil = 0;
  // Appuis longs en attente : annulés dès qu'un balayage démarre ou que l'écran est redessiné,
  // sinon un minuteur orphelin pouvait sélectionner une case après plusieurs swipes rapides.
  const pendingLongPresses = new Set();
  function cancelLongPresses(){ pendingLongPresses.forEach(f=>f()); pendingLongPresses.clear(); }
  let pendingNavFinish = null;
  function enterSelectMode(ds){
    view.selectMode = true;
    view.selectedDays = [ds];
    ignoreClickUntil = Date.now() + 700;
    try { if (navigator.vibrate) navigator.vibrate(20); } catch(e){}
    render();
  }
  function attachLongPress(el, cb){
    let timer = null, sx = 0, sy = 0;
    const clear = ()=>{ if (timer) { clearTimeout(timer); timer = null; } pendingLongPresses.delete(clear); };
    el.addEventListener('pointerdown', (e)=>{
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (navBusy) return;
      sx = e.clientX; sy = e.clientY;
      clear();
      try { el.setPointerCapture(e.pointerId); } catch(err){}
      timer = setTimeout(()=>{ timer = null; pendingLongPresses.delete(clear); if (el.isConnected && !navBusy) cb(); }, 450);
      pendingLongPresses.add(clear);
    });
    el.addEventListener('pointermove', (e)=>{
      if (timer && (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10)) clear();
    });
    ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t, clear));
    el.addEventListener('contextmenu', (e)=>e.preventDefault());
  }

  function buildDayCell(ds, otherMonth, maxLines){
    const todayS = todayStr();
    const picked = view.selectedDays.includes(ds);
    const cell = document.createElement('div');
    cell.className = 'day-cell' + (otherMonth?' other-month':'') + (ds===todayS?' today':'') + (picked?' picked':'');
    const evs = eventsFor(ds);
    let linesHtml = '';
    evs.slice(0,maxLines).forEach(e=>{
      const cols = e.participants.filter(id=>!state.hidden.includes(id)).map(id=>{ const pr=profileById(id); return pr?pr.color:'#999'; });
      linesHtml += `<div class="ev-line${e.important?' imp':''}" style="background:${lineBg(cols)}"><span class="ev-line-text">${impHtml(e)}${iconHtml(e)}${e.start?escapeHtml(e.start)+' · ':''}${escapeHtml(e.title)}</span></div>`;
    });
    const dnum = Number(ds.slice(8,10));
    cell.innerHTML = `<div class="day-num">${dnum}${evs.some(x=>x.important)?'<span class="imp-day">★</span>':''}</div>${linesHtml}${evs.length>maxLines?`<div class="more">+${evs.length-maxLines} autre${evs.length-maxLines>1?'s':''}</div>`:''}${picked?'<div class="pick-mark">✓</div>':''}`;
    cell.onclick = ()=>{
      if (Date.now() < ignoreClickUntil) return;
      if (view.selectMode) {
        if (picked) view.selectedDays = view.selectedDays.filter(x=>x!==ds);
        else view.selectedDays.push(ds);
        render();
        return;
      }
      if (!evs.length) { openEventForm(null, ds); return; }
      view.openDay = ds; view.sheet='day'; render();
    };
    attachLongPress(cell, ()=>{ if (!view.selectMode) enterSelectMode(ds); });
    return cell;
  }

  function renderCalendar(){
    // Vue semaine : la frise horaire (renderWeekHours) est la "belle" vue —
    // elle sert déjà en paysage téléphone. Sur grand écran (navigateur), on
    // a toute la largeur voulue pour l'afficher aussi, plutôt que la grille
    // clairsemée de renderWeekView (peu d'infos, cases vides).
    if (view.mode==='week') return (landscapePhone || isWide()) ? renderWeekHours() : renderWeekAgenda();
    if (view.mode==='day') return renderDayView();
    return renderMonthView();
  }

  function buildNeighborCard(dir){
    if (dir < 0) stepPrev(); else stepNext();
    const el = renderCalendar();
    if (dir < 0) stepNext(); else stepPrev();
    return el;
  }
  function attachSwipeNav(el){
    let startX = 0, startY = 0, startT = 0;
    let tracking = false;
    let dragging = false;
    let viewport = null, curEl = null, prevCard = null, nextCard = null, width = 1;
    let pendingDx = 0, rafId = 0;

    function scheduleFrame(dx){
      pendingDx = dx;
      if (rafId) return;
      rafId = requestAnimationFrame(()=>{
        rafId = 0;
        curEl.style.transform = `translate3d(${pendingDx}px,0,0)`;
        prevCard.style.transform = `translate3d(${pendingDx - width}px,0,0)`;
        nextCard.style.transform = `translate3d(${pendingDx + width}px,0,0)`;
      });
    }

    function cleanup(){
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      if (prevCard) { prevCard.remove(); prevCard = null; }
      if (nextCard) { nextCard.remove(); nextCard = null; }
      if (curEl) {
        curEl.style.position = ''; curEl.style.top = ''; curEl.style.left = ''; curEl.style.width = '';
        curEl.style.transform = ''; curEl.style.transition = ''; curEl.style.willChange = '';
      }
      if (viewport) viewport.style.minHeight = '';
      viewport = curEl = null;
    }

    el.addEventListener('touchstart', (e)=>{
      // Nouveau swipe pendant l'animation du précédent : on termine celui-ci tout de suite
      // au lieu d'ignorer le geste (swipes rapides enchaînés).
      if (navBusy && pendingNavFinish) pendingNavFinish();
      if (e.touches.length !== 1 || navBusy) { tracking = false; return; }
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      startT = Date.now();
      tracking = true;
      dragging = false;
    }, { passive:true });

    el.addEventListener('touchmove', (e)=>{
      if (!tracking) return;
      const t = e.touches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;
      if (!dragging) {
        if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
        if (Math.abs(dx) < Math.abs(dy) * 1.2) { tracking = false; return; }
        dragging = true;
        cancelLongPresses();
        viewport = document.querySelector('.cal-viewport');
        curEl = viewport ? viewport.querySelector('.cal-wrap') : null;
        if (!viewport || !curEl) { tracking = false; dragging = false; return; }
        width = viewport.offsetWidth || 1;
        viewport.style.minHeight = viewport.offsetHeight + 'px';
        curEl.style.position = 'absolute'; curEl.style.top = '0'; curEl.style.left = '0'; curEl.style.width = '100%';
        curEl.style.transition = 'none'; curEl.style.willChange = 'transform';
        prevCard = buildNeighborCard(-1);
        nextCard = buildNeighborCard(1);
        [prevCard, nextCard].forEach(c=>{
          c.style.position = 'absolute'; c.style.top = '0'; c.style.left = '0'; c.style.width = '100%';
          c.style.transition = 'none'; c.style.willChange = 'transform';
        });
        prevCard.style.transform = `translate3d(${-width}px,0,0)`;
        nextCard.style.transform = `translate3d(${width}px,0,0)`;
        viewport.appendChild(prevCard);
        viewport.appendChild(nextCard);
        if (usesTimeline()) syncDayScroll(curEl, [prevCard, nextCard]);
        initMarquees();
      }
      if (!dragging) return;
      e.preventDefault();
      scheduleFrame(dx);
    }, { passive:false });

    function settle(e){
      if (!tracking) return;
      tracking = false;
      if (!dragging) return;
      dragging = false;
      ignoreClickUntil = Date.now() + 350;
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      const touch = (e.changedTouches && e.changedTouches[0]) || null;
      const dx = touch ? touch.clientX - startX : 0;
      const dt = Math.max(1, Date.now() - startT);
      const speed = Math.abs(dx) / dt;
      const goingPrev = dx > 0;
      const complete = Math.abs(dx) > width * 0.32 || speed > 0.55;
      const dur = '.22s'; const ease = 'cubic-bezier(.22,.61,.36,1)';
      [curEl, prevCard, nextCard].forEach(x=>{ x.style.transition = `transform ${dur} ${ease}`; });
      if (complete) {
        curEl.style.transform = `translate3d(${goingPrev ? width : -width}px,0,0)`;
        (goingPrev ? prevCard : nextCard).style.transform = 'translate3d(0,0,0)';
      } else {
        curEl.style.transform = 'translate3d(0,0,0)';
        prevCard.style.transform = `translate3d(${-width}px,0,0)`;
        nextCard.style.transform = `translate3d(${width}px,0,0)`;
      }
      navBusy = true;
      let done = false;
      const finish = ()=>{
        if (done) return; done = true;
        pendingNavFinish = null;
        navBusy = false;
        if (complete) {
          agendaScrollTop = null;
          if (goingPrev) stepPrev(); else stepNext();
          render();
        } else {
          cleanup();
        }
      };
      pendingNavFinish = finish;
      curEl.addEventListener('transitionend', finish, { once:true });
      setTimeout(finish, 320);
    }

    el.addEventListener('touchend', settle, { passive:true });
    el.addEventListener('touchcancel', settle, { passive:true });
  }

  function renderMonthView(){
    const wrap = document.createElement('div');
    wrap.className='cal-wrap';
    const wd = document.createElement('div'); wd.className='weekdays';
    WEEKDAYS.forEach(w=>{ const s=document.createElement('span'); s.textContent=w; wd.appendChild(s); });
    wrap.appendChild(wd);

    const grid = document.createElement('div'); grid.className='grid';
    const first = new Date(view.year, view.month, 1);
    let startOffset = (first.getDay()+6)%7;
    const daysInMonth = new Date(view.year, view.month+1, 0).getDate();
    const prevDays = new Date(view.year, view.month, 0).getDate();

    const cells = [];
    for (let i=startOffset; i>0; i--) cells.push({ d: prevDays-i+1, other:true, m: view.month-1 });
    for (let d=1; d<=daysInMonth; d++) cells.push({ d, other:false, m: view.month });
    while (cells.length % 7 !== 0 || cells.length < 35) cells.push({ d: cells.length - (startOffset+daysInMonth) + 1, other:true, m: view.month+1 });

    cells.forEach(c=>{
      let y=view.year, m=c.m;
      if (m<0){ m=11; y--; } else if (m>11){ m=0; y++; }
      const ds = dstr(y,m,c.d);
      grid.appendChild(buildDayCell(ds, c.other, isWide() ? 8 : MAX_LINES));
    });
    wrap.appendChild(grid);
    return wrap;
  }

  function renderWeekView(){
    const wrap = document.createElement('div');
    wrap.className='cal-wrap';
    const wd = document.createElement('div'); wd.className='weekdays';
    WEEKDAYS.forEach(w=>{ const s=document.createElement('span'); s.textContent=w; wd.appendChild(s); });
    wrap.appendChild(wd);

    const grid = document.createElement('div'); grid.className='grid';
    const mon = mondayOf(view.weekAnchor || todayStr());
    for (let i=0;i<7;i++){
      const d = new Date(mon); d.setDate(mon.getDate()+i);
      const ds = dstr(d.getFullYear(), d.getMonth(), d.getDate());
      grid.appendChild(buildDayCell(ds, false, isWide() ? 18 : MAX_LINES*2));
    }
    wrap.appendChild(grid);
    return wrap;
  }

  const DAY_START_MIN = 330;
  const NIGHT_UNITS = 0.6;
  function tlU(min){ return min < DAY_START_MIN ? (min/DAY_START_MIN)*NIGHT_UNITS : NIGHT_UNITS + (min-DAY_START_MIN)/60; }
  function tlMin(u){ return u < NIGHT_UNITS ? (u/NIGHT_UNITS)*DAY_START_MIN : DAY_START_MIN + (u-NIGHT_UNITS)*60; }
  const TL_TOTAL = tlU(1440);
  let dayHH = 32;
  let dayScrollTop = null;
  function toMin(t){
    if (!t) return null;
    const p = t.split(':');
    return (parseInt(p[0],10)||0)*60 + (parseInt(p[1],10)||0);
  }
  function pad2(n){ return String(n).padStart(2,'0'); }

  function layoutDayEvents(items){
    items.sort((a,b)=> a.s-b.s || b.e-a.e);
    const clusters = [];
    let cur = null;
    items.forEach(it=>{
      if (!cur || it.s >= cur.end) { cur = { items:[], end: it.e, cols:[] }; clusters.push(cur); }
      let c = 0;
      while (cur.cols[c] !== undefined && cur.cols[c] > it.s) c++;
      cur.cols[c] = it.e; it.col = c;
      cur.items.push(it);
      cur.end = Math.max(cur.end, it.e);
    });
    clusters.forEach(cl=>{ const n = cl.cols.length; cl.items.forEach(it=>{ it.n = n; }); });
    return items;
  }

  function renderDayView(){
    const ds = view.dayAnchor || todayStr();
    const wrap = document.createElement('div');
    wrap.className = 'cal-wrap day-wrap';

    const visible = eventsFor(ds);
    const allDay = visible.filter(e=>!e.start);
    const timed = timedItems(visible);

    const colorsOf = (e)=> e.participants.map(id=>{ const pr=profileById(id); return pr?pr.color:'#999'; });
    const namesOf = (e)=> e.participants.map(id=>{ const pr=profileById(id); return pr?pr.name:'?'; }).join(', ');

    if (allDay.length) {
      const bar = document.createElement('div'); bar.className = 'day-allday';
      bar.innerHTML = `<span class="day-allday-lab">Journée</span>`;
      allDay.forEach(e=>{
        const chip = document.createElement('div'); chip.className = 'allday-chip';
        chip.style.background = stripeBg(colorsOf(e));
        if (e.important) chip.classList.add('imp');
        chip.innerHTML = `<div class="event-plate"><div class="event-title" style="font-size:13px;">${impHtml(e)}${iconHtml(e)}${escapeHtml(e.title)}</div></div>`;
        chip.onclick = ()=>openEventForm(e, ds);
        bar.appendChild(chip);
      });
      wrap.appendChild(bar);
    }

    const scroll = document.createElement('div'); scroll.className = 'day-scroll';
    scroll.style.setProperty('--hh', dayHH + 'px');
    scroll.addEventListener('scroll', ()=>{ dayScrollTop = scroll.scrollTop; });

    const tl = document.createElement('div'); tl.className = 'tl';
    tl.style.height = `calc(var(--hh) * ${TL_TOTAL})`;

    tl.innerHTML = tlBackgroundHtml();

    const grid = document.createElement('div'); grid.className = 'tl-grid';
    layoutDayEvents(timed).forEach(it=>grid.appendChild(makeTlCard(it, ds, false)));

    if (ds === todayStr()) {
      const n = new Date();
      const now = document.createElement('div'); now.className = 'tl-now';
      now.style.top = `calc(var(--hh) * ${tlU(n.getHours()*60 + n.getMinutes())})`;
      grid.appendChild(now);
    }

    grid.onclick = (ev)=>{
      const rect = grid.getBoundingClientRect();
      const u = (ev.clientY - rect.top) / dayHH;
      let min = Math.floor(tlMin(Math.max(0, Math.min(TL_TOTAL, u))) / 15) * 15;
      min = Math.max(0, Math.min(23*60+45, min));
      openEventForm(null, ds, null, `${pad2(Math.floor(min/60))}:${pad2(min%60)}`);
    };

    tl.appendChild(grid);
    scroll.appendChild(tl);
    wrap.appendChild(scroll);
    return wrap;
  }

  function timedItems(evs){
    return evs.filter(e=>e.start).map(e=>{
      const s = toMin(e.start);
      let en = e.end ? toMin(e.end) : s + 60;
      if (en <= s) en = e.end ? 1440 : s + 60;
      en = Math.min(en, 1440);
      return { ev:e, s, e:en };
    });
  }
  function tlBackgroundHtml(){
    let html = `<div class="tl-night" style="height:calc(var(--hh) * ${NIGHT_UNITS})"></div>`;
    html += `<div class="tl-lab first" style="top:0">00h</div>`;
    html += `<div class="tl-line edge" style="top:calc(var(--hh) * ${NIGHT_UNITS})"></div>`;
    for (let h=6; h<=23; h++) {
      const u = tlU(h*60);
      html += `<div class="tl-line" style="top:calc(var(--hh) * ${u})"></div>`;
      html += `<div class="tl-lab" style="top:calc(var(--hh) * ${u})">${pad2(h)}h</div>`;
    }
    return html;
  }
  function makeTlCard(it, ds, compact){
    const e = it.ev;
    const cols = e.participants.map(id=>{ const pr=profileById(id); return pr?pr.color:'#999'; });
    const names = e.participants.map(id=>{ const pr=profileById(id); return pr?pr.name:'?'; }).join(', ');
    const u1 = tlU(it.s), u2 = tlU(it.e);
    const card = document.createElement('div');
    card.className = 'tl-ev' + ((compact || (it.e - it.s) < 45) ? ' s' : '') + (e.important ? ' imp' : '');
    card.style.background = stripeBg(cols);
    card.style.top = `calc(var(--hh) * ${u1})`;
    card.style.height = `calc(var(--hh) * ${(u2-u1).toFixed(4)} - 1px)`;
    card.style.left = (it.col/it.n*100).toFixed(3) + '%';
    card.style.width = `calc(${(100/it.n).toFixed(3)}% - 2px)`;
    const tall = !compact && (u2-u1) >= 1.25;
    card.innerHTML = `<div class="event-plate">
        <div class="event-title">${impHtml(e)}${iconHtml(e)}${escapeHtml(e.title)}</div>
        ${tall ? `<div class="event-meta">${e.start}${e.end?'–'+e.end:''} · ${escapeHtml(names)}${e.reminder?' ⏰':''}</div>` : ''}
      </div>`;
    card.onclick = (ev)=>{ ev.stopPropagation(); openEventForm(e, ds); };
    return card;
  }

  function vStripe(colors){
    if (!colors.length) colors = ['#999'];
    if (colors.length === 1) return colors[0];
    const n = colors.length, step = 100/n, stops = [];
    colors.forEach((c,i)=>{ stops.push(`${c} ${(i*step).toFixed(2)}%`, `${c} ${((i+1)*step).toFixed(2)}%`); });
    return `linear-gradient(to bottom, ${stops.join(', ')})`;
  }
  function makeWkCard(it, ds){
    const e = it.ev;
    const cols = e.participants.map(id=>{ const pr=profileById(id); return pr?pr.color:'#999'; });
    const u1 = tlU(it.s), u2 = tlU(it.e), dur = it.e - it.s;
    const card = document.createElement('div');
    card.className = 'wk-ev' + (dur < 45 ? ' xs' : (dur < 75 ? ' s' : ''));
    card.style.background = pastelStripeBg(cols);
    card.style.top = `calc(var(--hh) * ${u1} + 1px)`;
    card.style.height = `calc(var(--hh) * ${(u2-u1).toFixed(4)} - 2px)`;
    card.style.left = `calc(${(it.col/it.n*100).toFixed(3)}% + 1px)`;
    card.style.width = `calc(${(100/it.n).toFixed(3)}% - 2px)`;
    const bar = document.createElement('div'); bar.className = 'wk-bar';
    bar.style.background = vStripe(cols);
    card.appendChild(bar);
    const tall = dur >= 120;
    const narrow = it.n > 1;
    const makeAvs = (max, cls)=>{
      const wrap = document.createElement('span'); wrap.className = cls;
      const list = e.participants.map(id=>profileById(id)).filter(Boolean);
      list.slice(0, max).forEach(pr=>{
        const a = document.createElement('span'); a.className = 'wk-av';
        a.style.background = pr.color;
        if (dur >= 45) a.textContent = pr.name[0].toUpperCase();
        wrap.appendChild(a);
      });
      if (list.length > max) {
        const more = document.createElement('span'); more.className = 'wk-av';
        more.style.background = 'var(--ink-soft)';
        if (dur >= 45) more.textContent = '+' + (list.length - max);
        wrap.appendChild(more);
      }
      return wrap;
    };
    const text = document.createElement('div'); text.className = 'wk-text';
    const line = document.createElement('div'); line.className = 'wk-line';
    line.innerHTML = `<div class="wk-title${tall?' wrap':''}">${iconHtml(e)}${escapeHtml(e.title)}</div>`;
    if (!tall && e.participants.length) line.appendChild(makeAvs(narrow ? 1 : 2, 'wk-avs-inline'));
    text.appendChild(line);
    card.appendChild(text);
    if (tall && e.participants.length) card.appendChild(makeAvs(narrow ? 1 : 3, 'wk-avs'));
    card.onclick = (ev)=>{ ev.stopPropagation(); openEventForm(e, ds); };
    return card;
  }

  function usesTimeline(){ return view.mode==='day' || (view.mode==='week' && (landscapePhone || isWide())); }
  function minuteFromY(clientY, el){
    const rect = el.getBoundingClientRect();
    const u = (clientY - rect.top) / dayHH;
    let min = Math.floor(tlMin(Math.max(0, Math.min(TL_TOTAL, u))) / 15) * 15;
    return Math.max(0, Math.min(23*60+45, min));
  }

  let agendaScrollTop = null;
  const AG_DAYNAMES = ['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'];
  function renderWeekAgenda(){
    const mon = mondayOf(view.weekAnchor || todayStr());
    const today = todayStr();
    const wrap = document.createElement('div');
    wrap.className = 'cal-wrap ag-wrap';
    wrap.addEventListener('scroll', ()=>{ agendaScrollTop = wrap.scrollTop; });
    for (let i=0; i<7; i++) {

        if (Date.now() < ignoreClickUntil) return;
        if (view.selectMode) {
          if (view.selectedDays.includes(ds)) view.selectedDays = view.selectedDays.filter(x=>x!==ds);
          else view.selectedDays.push(ds);
          render();
          return;
        }
        view.openDay = ds; view.sheet = 'day'; render();

    return wrap;

  const WK_NAMES = ['lun','mar','mer','jeu','ven','sam','dim'];

    days.forEach((ds,i)=>{

      col.style.width = (100/7).toFixed(4) + '%';

      if (ds === today) {
        const n = new Date();
        const now = document.createElement('div'); now.className = 'tl-now';
        now.style.top = `calc(var(--hh) * ${tlU(n.getHours()*60 + n.getMinutes())})`;
        col.appendChild(now);
      }
      col.onclick = (ev)=>{
        const min = minuteFromY(ev.clientY, col);
        openEventForm(null, ds, null, `${pad2(Math.floor(min/60))}:${pad2(min%60)}`);

      grid.appendChild(col);

  function timelineFocusMin(){
    const today = todayStr();
    let days;
    if (view.mode === 'week') {
      const mon = mondayOf(view.weekAnchor || today);
      days = [];
      for (let i=0;i<7;i++){ const d = new Date(mon); d.setDate(mon.getDate()+i); days.push(dstr(d.getFullYear(), d.getMonth(), d.getDate())); }
    } else {
      days = [view.dayAnchor || today];
    }
    if (days.includes(today)) { const n = new Date(); return n.getHours()*60 + n.getMinutes(); }
    const mins = state.events.filter(e=>days.includes(e.date) && e.start).map(e=>toMin(e.start));
    return mins.length ? Math.min(...mins) : 8*60;
  }

  function fitDayView(){
    if (!usesTimeline()) return;
    const viewport = document.querySelector('.cal-viewport');
    const scroll = viewport ? viewport.querySelector('.day-scroll') : null;
    if (!scroll) return;
    const bottomPad = isWide() ? 12 : 80;
    const avail = scroll.clientHeight - bottomPad;
    if (avail > 0) {
      dayHH = Math.max(landscapePhone ? 20 : 24, Math.min(60, Math.floor(avail / TL_TOTAL)));
      viewport.querySelectorAll('.day-scroll').forEach(s=>s.style.setProperty('--hh', dayHH + 'px'));
    }
    if (scroll.scrollHeight > scroll.clientHeight + 2) {
      if (dayScrollTop !== null) {
        scroll.scrollTop = dayScrollTop;
      } else {
        scroll.scrollTop = Math.max(0, tlU(timelineFocusMin())*dayHH - scroll.clientHeight/3);
      }
    }
  }
  function syncDayScroll(from, tos){
    const a = from.querySelector('.day-scroll');
    if (!a) return;
    tos.forEach(t=>{ const b = t.querySelector('.day-scroll'); if (b) b.scrollTop = a.scrollTop; });
  }

  function renderDaySheet(){
    const scrim = document.createElement('div'); scrim.className='scrim';

    const sheet = document.createElement('div'); sheet.className='sheet';

      .filter(e=>e.participants.some(id=>!state.hidden.includes(id)))
      .sort(compareEvents);
    const hiddenCount = allOfDay.length - evs.length;
