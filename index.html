  function openEventForm(event, dateStr, bulkDates, startTime){
    view.editingEvent = event ? {...event, participants:[...event.participants]} : {
      id: uid(), title:'', date: dateStr, start: startTime || '', end:'', icon:'', reminder: null, important: false,
      participants: state.activeId?[state.activeId]:[]
    };
    view._bulkDates = bulkDates || null;
    view._formFrom = view.sheet;
    view.sheet='form';
    render();
  }
  function closeForm(){
    view.sheet = (view._formFrom === 'day') ? 'day' : null;
    render();
  }
  function renderEventForm(){
    const scrim = document.createElement('div'); scrim.className='scrim center';
    scrim.onclick = (e)=>{ if(e.target===scrim){ closeForm(); } };
    const sheet = document.createElement('div'); sheet.className='sheet';
    const ev = view.editingEvent;
    const isNew = !state.events.some(x=>x.id===ev.id);
    const bulk = view._bulkDates;
    sheet.innerHTML = `
      <div class="sheet-header"><h2>${bulk?`Nouvel événement (${bulk.length} jours)`:(isNew?'Nouvel événement':'Modifier')}</h2><button class="sheet-close" id="close-form">✕</button></div>
      ${bulk?`<div class="bulk-note">Cet événement sera appliqué aux ${bulk.length} jours sélectionnés.</div>`:''}
      <div class="preset-row" id="presets"></div>
      <div class="form-row"><label>Titre</label><input type="text" id="f-title" placeholder="ex. Anniversaire de Mamie" value="${escapeAttr(ev.title)}"></div>
      <div class="form-row"><label>Icône</label><div style="display:flex; gap:8px; align-items:flex-start;"><div class="chips" id="f-icons" style="flex:1; min-width:0;"></div><div id="f-imp"></div></div></div>
      ${bulk?'':`<div class="form-row"><label>Date</label><input type="date" id="f-date" value="${ev.date}"></div>`}
      <div class="form-row time-row">
        <div style="flex:1"><label>Début</label><button type="button" class="time-field" id="f-start-btn">${ev.start||'--:--'}</button></div>
        <div style="flex:1"><label>Fin</label><button type="button" class="time-field" id="f-end-btn">${ev.end||'--:--'}</button></div>
      </div>
      <div class="form-row"><label>⏰ Rappel</label><div class="chips" id="f-reminder"></div><div id="f-reminder-note" class="reminder-note"></div></div>
      <div class="form-row"><label>Qui participe ?</label><div class="chips" id="f-participants"></div></div>
      <button class="save-btn" id="f-save">Enregistrer</button>
    `;
    const iconWrap = sheet.querySelector('#f-icons');
    let iconsOpen = false;
    function chipBtn(text, on, onClick, big){
      const b = document.createElement('button'); b.type='button';
      b.className='chip'+(on?' on':'');
      b.style.background = on?'var(--ink)':'var(--surface)';
      b.style.borderColor = on?'var(--ink)':'var(--line)';
      if (big) b.style.fontSize='16px';
      b.textContent = text;
      b.onclick = onClick;
      return b;
    }
    const impWrap = sheet.querySelector('#f-imp');
    function drawImportant(){
      impWrap.innerHTML = '';
      const on = !!ev.important;
      const b = chipBtn('', on, ()=>{ ev.important = !ev.important; drawImportant(); });
      b.innerHTML = on ? '<span style="color:#F2C14E">★</span> Important' : '☆ Important';
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      impWrap.appendChild(b);
    }
    function drawIcons(){
      iconWrap.innerHTML='';
      impWrap.style.display = iconsOpen ? 'none' : '';
      if (!iconsOpen) {
        iconWrap.appendChild(chipBtn((ev.icon || '∅') + '  ▾', true, ()=>{ iconsOpen = true; drawIcons(); }, true));
        return;
      }
      ICON_CHOICES.forEach(ic=>{
        const on = (ev.icon||'')===ic;
        iconWrap.appendChild(chipBtn(ic || '∅', on, ()=>{ ev.icon = ic; iconsOpen = false; drawIcons(); }, true));
      });
    }
    drawImportant();
    drawIcons();
    const presetsWrap = sheet.querySelector('#presets');
    SHIFT_PRESETS.forEach(name=>{
      const b = document.createElement('button'); b.className='preset'; b.textContent=name;
      b.onclick = ()=>{
        sheet.querySelector('#f-title').value = name;
        ev.icon = PRESET_ICON[name]||'';
        drawIcons();
        const t = PRESET_TIME[name];
        if (t) {
          ev.start = t.start; ev.end = t.end;
          sheet.querySelector('#f-start-btn').textContent = ev.start || '--:--';
          sheet.querySelector('#f-end-btn').textContent = ev.end || '--:--';
        }
      };
      presetsWrap.appendChild(b);
    });
    const remWrap = sheet.querySelector('#f-reminder');
    const remNote = sheet.querySelector('#f-reminder-note');
    let remOpen = false;
    function drawReminders(){
      remWrap.innerHTML = '';
      const cur = ev.reminder ?? null;
      const isCustom = cur !== null && !REMINDER_CHOICES.some(r=>r.min===cur);
      if (!remOpen) {
        const lab = cur === null ? 'Aucun' : reminderLabel(cur);
        remWrap.appendChild(chipBtn(lab + '  ▾', true, ()=>{ remOpen = true; drawReminders(); }));
      } else {
        REMINDER_CHOICES.forEach(r=>{
          remWrap.appendChild(chipBtn(r.label, cur === r.min, ()=>{ ev.reminder = r.min; remOpen = false; drawReminders(); }));
        });
        remWrap.appendChild(chipBtn(isCustom ? '✏️ ' + reminderLabel(cur) : '✏️ Perso', isCustom, ()=>{
          const base = isCustom ? cur : 90;
          const startVal = String(Math.floor(base/60)).padStart(2,'0') + ':' + String(base%60).padStart(2,'0');
          openTimeWheel(startVal, (val)=>{
            if (!val) return;
            const mins = toMin(val);
            if (!mins) { toast('Choisis une durée d\'au moins 5 minutes.'); return; }
            ev.reminder = mins; remOpen = false; drawReminders();
          }, { title: 'Rappel combien de temps avant ?', clearLabel: null, units: true });
        }));
      }
      remNote.textContent = (ev.reminder !== null && ev.reminder !== undefined && !ev.start)
        ? "Sans heure de début, le rappel se comptera à partir de minuit."
        : '';
    }
    drawReminders();

    const partWrap = sheet.querySelector('#f-participants');
    function drawChips(){
      partWrap.innerHTML='';
      state.profiles.forEach(p=>{
        const on = ev.participants.includes(p.id);
        const c = document.createElement('button'); c.type='button';
        c.className='chip'+(on?' on':''); c.style.background = on?p.color:'var(--surface)';
        c.style.borderColor = on?p.color:'var(--line)';
        c.innerHTML = `<span class="dot" style="background:${on?'#fff':p.color}"></span>${p.name}`;
        c.onclick = ()=>{
          if (on) ev.participants = ev.participants.filter(id=>id!==p.id);
          else ev.participants.push(p.id);
          drawChips();
        };
        partWrap.appendChild(c);
      });
    }
    drawChips();
    sheet.querySelector('#f-start-btn').onclick = ()=>{
      openTimeWheel(ev.start, (val)=>{
        ev.start = val;
        sheet.querySelector('#f-start-btn').textContent = val || '--:--';
        drawReminders();
      });
    };
    sheet.querySelector('#f-end-btn').onclick = ()=>{
      openTimeWheel(ev.end, (val)=>{ ev.end = val; sheet.querySelector('#f-end-btn').textContent = val || '--:--'; });
    };
    sheet.querySelector('#close-form').onclick = closeForm;
    sheet.querySelector('#f-save').onclick = async ()=>{
      const title = sheet.querySelector('#f-title').value.trim();
      if (!title) { sheet.querySelector('#f-title').focus(); return; }
      ev.title = title;
      if (!ev.participants.length && state.activeId) ev.participants=[state.activeId];
      const btn = sheet.querySelector('#f-save'); btn.disabled = true; btn.textContent = 'Enregistrement…';
      snapshot();
      try {
        const pushedIds = [];
        if (bulk) {
          for (const ds of bulk) {
            const newId = uid();
            await upsertEventDb({ id: newId, title, date: ds, start: ev.start, end: ev.end, icon: ev.icon||'', reminder: ev.reminder ?? null, important: !!ev.important, participants: [...ev.participants] });
            pushedIds.push(newId);
          }
          await logActivity(`a ajouté « ${title} » sur ${bulk.length} jours`);
          view.selectMode = false; view.selectedDays = [];
        } else {
          ev.date = sheet.querySelector('#f-date').value || ev.date;
          const existed = state.events.some(x=>x.id===ev.id);
          await upsertEventDb(ev);
          await logActivity(existed ? `a modifié « ${title} »` : `a ajouté « ${title} »`);
          pushedIds.push(ev.id);
        }
        await reloadHouseholdData();
        pushedIds.forEach(id=>syncToGoogle('push', { event_id: id }));
        view.sheet = null;
      } catch(err){
        alert("Erreur d'enregistrement : "+err.message);
      }
      render();
    };
    if (!bulk && !isNew) {
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'danger-btn';
      del.textContent = '🗑 Supprimer cet événement';
      del.onclick = async ()=>{
        if (!confirm(`Supprimer « ${ev.title} » ?`)) return;
        del.disabled = true;
        await removeEvent(ev);
        view.sheet = null;
        render();
      };
      sheet.appendChild(del);
    }
    scrim.appendChild(sheet);
    return scrim;
  }

  function renderLogSheet(){
    const scrim = document.createElement('div'); scrim.className='scrim';
    scrim.onclick = (e)=>{ if(e.target===scrim){ view.sheet=null; render(); } };
    const sheet = document.createElement('div'); sheet.className='sheet';
    sheet.innerHTML = `<div class="sheet-handle"></div>
      <div class="sheet-header"><h2>Journal</h2><button class="sheet-close" id="close-log">✕</button></div>
      <div id="log-list"></div>`;
    const list = sheet.querySelector('#log-list');
    if (!state.log.length) {
      const p = document.createElement('div'); p.className='empty-note'; p.textContent='Aucune activité pour le moment.';
      list.appendChild(p);
    }
    state.log.forEach(l=>{
      const row = document.createElement('div'); row.className='log-row';
      row.innerHTML = `<b>${escapeHtml(l.who)}</b> ${escapeHtml(l.action)}<div class="log-time">${fmtTime(l.ts)}</div>`;
      list.appendChild(row);
    });
    sheet.querySelector('#close-log').onclick = ()=>{ view.sheet=null; render(); };
    scrim.appendChild(sheet);
    return scrim;
  }

  function renderSearchSheet(){
    const scrim = document.createElement('div'); scrim.className='scrim';
    scrim.onclick = (e)=>{ if(e.target===scrim){ view.sheet=null; render(); } };
    const sheet = document.createElement('div'); sheet.className='sheet';
    sheet.innerHTML = `<div class="sheet-handle"></div>
      <div class="sheet-header"><h2>Rechercher</h2><button class="sheet-close" id="close-search">✕</button></div>
      <div class="form-row"><input type="text" id="search-input" placeholder="Titre d'un événement..." autofocus></div>
      <div id="search-results"></div>`;
    const resultsWrap = sheet.querySelector('#search-results');
    function runSearch(q){
      resultsWrap.innerHTML = '';
      const query = q.trim().toLowerCase();
      if (!query) { const p=document.createElement('div'); p.className='empty-note'; p.textContent='Tape un mot-clé pour chercher dans tous les événements.'; resultsWrap.appendChild(p); return; }
      const matches = state.events.filter(e=>e.title.toLowerCase().includes(query)).sort((a,b)=>a.date.localeCompare(b.date) || compareEvents(a,b));
      if (!matches.length) { const p=document.createElement('div'); p.className='empty-note'; p.textContent='Aucun événement trouvé.'; resultsWrap.appendChild(p); return; }
      matches.forEach(e=>{
        const row = document.createElement('div'); row.className='event-row';
        const cols = e.participants.map(id=>{ const pr=profileById(id); return pr?pr.color:'#999'; });
        const d = new Date(e.date+'T00:00:00');
        const dateLabel = d.toLocaleDateString('fr-FR',{weekday:'short', day:'numeric', month:'short'});
        row.style.background = stripeBg(cols);
        if (e.important) row.classList.add('imp');
        row.innerHTML = `${e.important?'<span class="imp-badge" aria-label="Important">★</span>':''}<div class="event-info"><div class="event-plate">
            <div class="event-title">${iconHtml(e)}${escapeHtml(e.title)}</div>
            <div class="event-meta" style="text-transform:capitalize">${dateLabel}${e.start?' · '+e.start:''}</div>
          </div></div>
          ${e.reminder ? `<span class="rem-badge">⏰ ${reminderLabel(e.reminder)}</span>` : ''}`;
        row.onclick = ()=>{ view.openDay = e.date; view.sheet='day'; render(); };
        resultsWrap.appendChild(row);
      });
    }
    runSearch('');
    sheet.querySelector('#search-input').oninput = (e)=>runSearch(e.target.value);
    sheet.querySelector('#close-search').onclick = ()=>{ view.sheet=null; render(); };
    scrim.appendChild(sheet);
    return scrim;
  }

  function renderSwitchSheet(){
    const scrim = document.createElement('div'); scrim.className='scrim';
    scrim.onclick = (e)=>{ if(e.target===scrim){ view.sheet=null; render(); } };
    const sheet = document.createElement('div'); sheet.className='sheet';
    const code = state.household ? state.household.invite_code : '';
    sheet.innerHTML = `<div class="sheet-handle"></div>
      <div class="sheet-header"><h2>Mon compte</h2><button class="sheet-close" id="close-sw">✕</button></div>
      <div id="who-list"></div>
      <div class="bulk-note">Code d'invitation du foyer : <b style="font-size:16px;letter-spacing:.05em;">${escapeHtml(code)}</b><br>Partage-le pour que l'autre parent rejoigne ce foyer.</div>
      <button class="ghost-btn" id="copy-code">Copier le code</button>

      <hr class="section-sep">
      <div class="section-title">Profils enfants</div>
      <div class="field">
        <label for="guest-name">Ajouter un profil enfant (sans compte ni email)</label>
        <input id="guest-name" type="text" placeholder="Prénom de l'enfant" maxlength="20">
        <div class="swatches" id="guest-swatches"></div>
      </div>
      <div id="guest-error" style="color:var(--palette-4);font-size:13px;min-height:16px;"></div>
      <button class="ghost-btn" id="add-guest-btn">➕ Ajouter ce profil</button>
      <hr class="section-sep">
      <div id="google-box"></div>

      <hr class="section-sep">
      <button class="ghost-btn" id="open-log-btn">${logIcon(16)} Voir le journal</button>
      <button class="ghost-btn" id="sign-out-btn">Se déconnecter</button>`;
    renderGoogleBox(sheet.querySelector('#google-box'));
    const list = sheet.querySelector('#who-list');
    state.profiles.forEach(p=>{
      const row = document.createElement('div'); row.className='who';
      row.innerHTML = `<div class="avatar" style="background:${p.color}">${p.name[0].toUpperCase()}</div><span>${escapeHtml(p.name)}</span>`;
      if (state.myProfile && p.id===state.myProfile.id) {
        const badge = document.createElement('span'); badge.style.cssText='margin-left:auto;font-size:12px;color:var(--ink-soft);font-weight:700;'; badge.textContent='Toi';
        row.appendChild(badge);
      } else if (!p.user_id) {
        const badge = document.createElement('span'); badge.style.cssText='margin-left:auto;font-size:12px;color:var(--ink-soft);'; badge.textContent='Invité';
        row.appendChild(badge);
        const del = document.createElement('button');
        del.textContent='✕'; del.setAttribute('aria-label','Supprimer ce profil');
        del.style.cssText='margin-left:8px;background:none;border:none;color:var(--palette-4);font-size:14px;cursor:pointer;padding:2px 4px;';
        del.onclick = async (e)=>{
          e.stopPropagation();
          if (!confirm(`Supprimer le profil « ${p.name} » ? Il sera retiré des événements où il apparaît.`)) return;
          try { await deleteGuestProfile(p); render(); }
          catch(err){ alert('Erreur : '+err.message); }
        };
        row.appendChild(del);
      }
      list.appendChild(row);
    });
    let guestColor = PALETTE[state.profiles.length % PALETTE.length];
    const gsw = sheet.querySelector('#guest-swatches');
    PALETTE.forEach(c=>{
      const s = document.createElement('div');
      s.className='swatch' + (c===guestColor?' selected':'');
      s.style.background=c;
      s.onclick=()=>{ guestColor=c; [...gsw.children].forEach(x=>x.classList.remove('selected')); s.classList.add('selected'); };
      gsw.appendChild(s);
    });
    sheet.querySelector('#close-sw').onclick = ()=>{ view.sheet=null; render(); };
    sheet.querySelector('#copy-code').onclick = async ()=>{
      try { await navigator.clipboard.writeText(code); } catch(e){}
    };
    sheet.querySelector('#add-guest-btn').onclick = async ()=>{
      const nameInput = sheet.querySelector('#guest-name');
      const errBox = sheet.querySelector('#guest-error');
      const name = nameInput.value.trim();
      errBox.textContent = '';
      if (!name) { errBox.textContent = 'Le prénom est requis.'; return; }
      try {
        await createGuestProfile(name, guestColor);
        view.sheet='switch'; render();
      } catch(err){ errBox.textContent = err.message || 'Erreur.'; }
    };
    sheet.querySelector('#open-log-btn').onclick = ()=>{ view.sheet='log'; render(); };
    sheet.querySelector('#sign-out-btn').onclick = async ()=>{ await sb.auth.signOut(); };
    scrim.appendChild(sheet);
    return scrim;
  }

  function renderGoogleBox(box){
    box.innerHTML = '';
    const note = document.createElement('div');
    note.className = 'bulk-note';
    note.style.marginBottom = '10px';

    if (!googleConfigured()) {
      note.innerHTML = `<b>Sauvegarde Google Agenda</b><br>Pas encore configurée. Il manque l'identifiant client dans le fichier de l'app — voir <b>guide_google.md</b>.<br><br>Adresse de retour à déclarer dans Google Cloud :<br><code style="font-size:12px;word-break:break-all;">${escapeHtml(appRedirectUri())}</code>`;
      box.appendChild(note);
      return;
    }

    if (!state.googleLinked) {
      note.innerHTML = `<b>Sauvegarde Google Agenda</b><br>Non connectée. Une fois reliée, chaque événement du foyer est recopié dans un agenda Google « Agenda Famille », qui te restera même s'il arrivait malheur à la base.`;
      box.appendChild(note);
      const btn = document.createElement('button');
      btn.className = 'ghost-btn'; btn.textContent = '🔗 Connecter Google Agenda';
      btn.onclick = startGoogleConnect;
      box.appendChild(btn);
      return;
    }

    const total = state.events.length;
    const saved = state.events.filter(e=>e.googleId).length;
    note.innerHTML = `<b>Sauvegarde Google Agenda</b><br>Connectée${state.googleEmail?' — '+escapeHtml(state.googleEmail):''}.<br><b>${saved}</b> événement${saved>1?'s':''} sur <b>${total}</b> déjà recopié${saved>1?'s':''} dans Google.`;
    box.appendChild(note);

    if (saved < total) {
      const back = document.createElement('button');
      back.className = 'ghost-btn';
      back.textContent = `⬆ Sauvegarder les ${total-saved} événements manquants`;
      back.onclick = ()=>runBackfill(back);
      box.appendChild(back);
    }

    const off = document.createElement('button');
    off.className = 'ghost-btn';
    off.textContent = 'Déconnecter Google Agenda';
    off.onclick = async ()=>{
      if (!confirm("Déconnecter Google Agenda ?\n\nLes événements déjà recopiés restent dans ton agenda Google, mais l'app cessera de l'alimenter.")) return;
      try {
        const { data, error } = await sb.functions.invoke('google-calendar', { body:{ action:'disconnect' } });
        if (error) throw error;
        if (data && data.error) throw new Error(data.error);
        await reloadHouseholdData();
        toast('Google Agenda déconnecté.');
        render();
      } catch(err){ toast('Déconnexion impossible : ' + ((err&&err.message)||'erreur')); }
    };
    box.appendChild(off);
  }

  async function runBackfill(btn){
    btn.disabled = true;
    let done = 0;
    try {
      for (let pass=0; pass<200; pass++) {
        btn.textContent = `Sauvegarde en cours… ${done} envoyé${done>1?'s':''}`;
        const { data, error } = await sb.functions.invoke('google-calendar', { body:{ action:'push_all', limit:40 } });
        if (error) throw error;
        if (data && data.error) throw new Error(data.error);
        done += (data && data.done) || 0;
        if (data && data.failures && data.failures.length) console.warn('Non envoyés :', data.failures);
        if (!data || !data.remaining || !data.done) break;
      }
      await reloadHouseholdData();
      toast(`Sauvegarde terminée : ${done} événement${done>1?'s':''} envoyé${done>1?'s':''} dans Google.`);
      render();
    } catch(err){
      btn.disabled = false;
      toast('Sauvegarde interrompue : ' + ((err&&err.message)||'erreur'));
    }
  }

  const WHEEL_HOURS = Array.from({length:24},(_,i)=>i);
  const WHEEL_MINUTES = [0,5,10,15,20,25,30,35,40,45,50,55];
  const WHEEL_ITEM_H = 44;

  const WHEEL_REPEAT = 9;
  function wheelOpacity(col, idx){
    [...col.children].forEach((el,i)=>{ el.style.opacity = i===idx?'1':'.35'; });
  }
  function fillWheelCol(col, values, selIdx, onSettle){
    const n = values.length;
    const mid = Math.floor(WHEEL_REPEAT/2);
    let html = '';
    for (let r=0; r<WHEEL_REPEAT; r++){
      values.forEach(v=>{ html += `<div class="wheel-item">${String(v).padStart(2,'0')}</div>`; });
    }
    col.innerHTML = html;
    const total = n*WHEEL_REPEAT;
    let curIdx = mid*n + selIdx;
    col.scrollTop = curIdx * WHEEL_ITEM_H;
    wheelOpacity(col, curIdx);
    let t=null;
    col.addEventListener('scroll', ()=>{
      if (t) clearTimeout(t);
      t = setTimeout(()=>{
        let idx = Math.round(col.scrollTop / WHEEL_ITEM_H);
        idx = Math.max(0, Math.min(total-1, idx));
        if (col.scrollTop !== idx*WHEEL_ITEM_H) col.scrollTo({top: idx*WHEEL_ITEM_H, behavior:'smooth'});
        wheelOpacity(col, idx);
        const realVal = values[((idx % n)+n)%n];
        onSettle(realVal);
        if (idx < n*1.5 || idx > total - n*1.5) {
          setTimeout(()=>{
            const newIdx = mid*n + (((idx % n)+n)%n);
            col.scrollTop = newIdx * WHEEL_ITEM_H;
            wheelOpacity(col, newIdx);
          }, 260);
        }
      }, 130);
    });
  }

  function openTimeWheel(currentValue, onConfirm, opts){
    opts = opts || {};
    const wpTitle = opts.title || "Choisir l'heure";
    const clearLabel = opts.clearLabel === undefined ? 'Aucune heure' : opts.clearLabel;
    let h = 8, m = 0;
    if (currentValue) {
      const parts = currentValue.split(':');
      h = parseInt(parts[0],10) || 0;
      m = Math.round((parseInt(parts[1],10)||0)/5)*5;
      if (m>55) m=55;
    }
    let curH = h, curM = m;
    const hIdx = WHEEL_HOURS.indexOf(h);
    const mIdx = WHEEL_MINUTES.indexOf(m);

    const scrim = document.createElement('div'); scrim.className='scrim center'; scrim.style.zIndex='30';
    const sheet = document.createElement('div'); sheet.className='sheet';
    sheet.innerHTML = `
      <div class="sheet-header"><h2>${escapeHtml(wpTitle)}</h2><button class="sheet-close" id="wp-close">✕</button></div>
      <div class="wheel-frame">
        <div class="wheel-highlight"></div>
        <div class="wheel-picker">
          <div class="wheel-col" id="wp-hour"></div>
          <div class="wheel-colon">${opts.units ? 'h' : ':'}</div>
          <div class="wheel-col" id="wp-min"></div>${opts.units ? '<div class="wheel-colon">min</div>' : ''}
        </div>
      </div>
      ${clearLabel ? `<button class="ghost-btn" id="wp-clear">${escapeHtml(clearLabel)}</button>` : ''}
      <button class="save-btn" id="wp-set">Définir</button>
    `;
    fillWheelCol(sheet.querySelector('#wp-hour'), WHEEL_HOURS, hIdx, (v)=>{ curH=v; });
    fillWheelCol(sheet.querySelector('#wp-min'), WHEEL_MINUTES, mIdx, (v)=>{ curM=v; });
    sheet.querySelector('#wp-close').onclick = ()=>scrim.remove();
    if (clearLabel) sheet.querySelector('#wp-clear').onclick = ()=>{ onConfirm(''); scrim.remove(); };
    sheet.querySelector('#wp-set').onclick = ()=>{
      onConfirm(`${String(curH).padStart(2,'0')}:${String(curM).padStart(2,'0')}`);
      scrim.remove();
    };
    scrim.onclick = (e)=>{ if(e.target===scrim) scrim.remove(); };
    scrim.appendChild(sheet);
    document.body.appendChild(scrim);
    const midRep = Math.floor(WHEEL_REPEAT/2);
    const hourCol = sheet.querySelector('#wp-hour'), minCol = sheet.querySelector('#wp-min');
    hourCol.scrollTop = (midRep*WHEEL_HOURS.length + hIdx) * WHEEL_ITEM_H;
    minCol.scrollTop = (midRep*WHEEL_MINUTES.length + mIdx) * WHEEL_ITEM_H;
    wheelOpacity(hourCol, midRep*WHEEL_HOURS.length + hIdx);
    wheelOpacity(minCol, midRep*WHEEL_MINUTES.length + mIdx);
  }

  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }



  function detectLandscapePhone(){
    let land;
    try {
      land = (screen.orientation && screen.orientation.type)
        ? screen.orientation.type.indexOf('landscape') === 0
        : Math.abs(window.orientation || 0) === 90;
    } catch(e){ land = window.innerWidth > window.innerHeight; }
    const small = Math.min(screen.width || 9999, screen.height || 9999) < 600;
    return !!land && small;
  }
  function applyOrientationSwitch(lp){
    dayScrollTop = null;
    agendaScrollTop = null;
    view.viewMenuOpen = false;
    view._autoSwitched = false;
  }
  function stashFormFields(){
    if (view.sheet === 'form' && view.editingEvent) {
      const t = document.getElementById('f-title'); if (t) view.editingEvent.title = t.value;
      const d = document.getElementById('f-date'); if (d && d.value) view.editingEvent.date = d.value;
    }
  }
  function updateLayout(){
    const lp = detectLandscapePhone();
    const wide = window.innerWidth >= 780 || lp;
    const changedWide = document.body.classList.contains('is-wide') !== wide;
    const changedLp = lp !== landscapePhone;
    document.body.classList.toggle('is-wide', wide);
    document.body.classList.toggle('compact-h', lp);
    if (changedLp) { landscapePhone = lp; applyOrientationSwitch(lp); }
    if (changedWide || changedLp) { stashFormFields(); render(); }
  }
  let layoutTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(layoutTimer);
    layoutTimer = setTimeout(updateLayout, 120);
  });
  window.addEventListener('orientationchange', ()=>{
    setTimeout(updateLayout, 150);
    setTimeout(()=>{ updateLayout(); fitDayView(); }, 450);
  });
  if (screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener('change', ()=>{ updateLayout(); setTimeout(()=>{ updateLayout(); fitDayView(); }, 450); });
  }
  landscapePhone = detectLandscapePhone();
  document.body.classList.toggle('is-wide', window.innerWidth >= 780 || landscapePhone);
  document.body.classList.toggle('compact-h', landscapePhone);

  async function boot(){
    render();
    const { data: { session } } = await sb.auth.getSession();
    auth.session = session; auth.loading = false;
    if (session) { try { await afterLogin(); } catch(e){} }
    if (session && location.search.includes('code=')) {
      const linked = await finishGoogleConnect();
      if (linked) { try { await reloadHouseholdData(); } catch(e){} }
    }
    render();
    sb.auth.onAuthStateChange((event, session)=>{
      const hadSession = !!auth.session, hasSession = !!session;
      auth.session = session;
      if (!hadSession && !hasSession) return;
      if (session) {
        afterLogin().then(render).catch(()=>render());
      } else {
        if (rtChannel) { try { sb.removeChannel(rtChannel); } catch(e){} rtChannel = null; }
        state.household = null; state.myProfile = null; state.profiles = []; state.events = []; state.log = [];
        render();
      }
    });
  }
  boot();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
