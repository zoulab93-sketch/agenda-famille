<style>
  :root {
    --bg: #EEF2F5;
    --surface: #FFFFFF;
    --surface-soft: #F5F7F9;
    --ink: #23262B;
    --ink-soft: #6B7280;
    --line: #DDE3E8;
    --shadow: 0 1px 2px rgba(35,38,43,.06), 0 4px 14px rgba(35,38,43,.06);
    --palette-1: #3B6EA5; --palette-2: #E8735C; --palette-3: #3FA796;
    --palette-4: #C4547A; --palette-5: #D9A441; --palette-6: #6A5DAD;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg:#171A1E; --surface:#21252B; --surface-soft:#262B32; --ink:#ECEEF1; --ink-soft:#9AA1AB; --line:#33393F;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg:#171A1E; --surface:#21252B; --surface-soft:#262B32; --ink:#ECEEF1; --ink-soft:#9AA1AB; --line:#33393F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; overflow-x:hidden; width:100%; }
  body { background: var(--bg); color: var(--ink); font-family:'Karla',sans-serif; min-height:100vh; -webkit-tap-highlight-color:transparent; }
  h1,h2,h3,.display { font-family:'Quicksand',sans-serif; }
  #app { max-width:640px; width:100%; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden; }

  #onboarding { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; text-align:center; gap:18px; }
  #onboarding .icon { font-size:40px; }
  #onboarding h1 { font-size:24px; font-weight:700; margin:0; }
  #onboarding p { color:var(--ink-soft); margin:0; max-width:320px; line-height:1.5; }
  .field { width:100%; max-width:320px; text-align:left; }
  .field label { display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px; font-weight:600; }
  .field input[type="text"], .field input[type="password"] { width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); font-family:'Karla',sans-serif; font-size:16px; }
  .field input[type="text"]:focus, .field input[type="password"]:focus { outline:2px solid var(--palette-1); outline-offset:1px; }
  .swatches { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .swatch { width:34px; height:34px; border-radius:50%; border:3px solid transparent; cursor:pointer; }
  .swatch.selected { border-color:var(--ink); }
  .btn-primary { width:100%; max-width:320px; padding:13px; border-radius:12px; border:none; cursor:pointer; background:var(--ink); color:var(--surface); font-family:'Quicksand',sans-serif; font-weight:700; font-size:16px; }
  .btn-primary:disabled { opacity:.4; cursor:not-allowed; }

  header { display:flex; align-items:center; justify-content:space-between; padding:10px 8px; gap:4px; position:sticky; top:0; background:var(--bg); z-index:5; }
  .month-nav { display:flex; align-items:center; gap:0; flex:1; min-width:0; }
  .month-nav button { flex-shrink:0; background:none; border:none; color:var(--ink); font-size:16px; padding:5px 5px; cursor:pointer; border-radius:8px; }
  .month-nav button:hover { background:var(--surface-soft); }
  .month-title { font-size:15px; font-weight:700; flex:1; min-width:0; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .header-actions { display:flex; align-items:center; gap:3px; flex-shrink:0; }
  .icon-btn { width:30px; height:30px; border-radius:50%; border:none; background:var(--surface); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:12px; color:var(--ink); flex-shrink:0; }
  .icon-btn.active { background:var(--ink); color:var(--surface); }
  .avatar { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-family:'Quicksand',sans-serif; cursor:pointer; border:none; font-size:12px; flex-shrink:0; }

  .legend { display:flex; gap:8px; padding:0 16px 10px; flex-wrap:wrap; }
  .legend-chip { display:flex; align-items:center; gap:6px; padding:5px 10px 5px 6px; border-radius:999px; background:var(--surface); box-shadow:var(--shadow); font-size:13px; cursor:pointer; border:none; color:var(--ink); font-family:'Karla',sans-serif; font-weight:600; }
  .legend-chip.off { opacity:.35; }
  .dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  .select-bar { margin:0 16px 10px; padding:10px 12px; border-radius:12px; background:var(--surface); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13.5px; font-weight:600; }
  .select-bar button { background:none; border:none; color:var(--palette-2); font-weight:700; font-size:13px; cursor:pointer; }

  .weekdays { display:grid; grid-template-columns: repeat(7, minmax(0,1fr)); padding:0 16px; margin-bottom:4px; }
  .weekdays span { text-align:center; font-size:11px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .grid { display:grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap:5px; padding:0 16px 100px; }
  .day-cell { background:var(--surface); border-radius:12px; min-height:98px; min-width:0; overflow:hidden; padding:5px 4px; display:flex; flex-direction:column; gap:2px; cursor:pointer; border:1.5px solid transparent; box-shadow:var(--shadow); position:relative; }
  .day-cell.other-month { opacity:.4; }
  .day-cell.today { border-color:var(--ink); }

  .shell { display:flex; flex-direction:column; flex:1; }

  /* Desktop / wide-viewport layout: real browser window, not a phone frame.
     Triggered by width, not aspect ratio, so it also fires on a tall
     desktop monitor — the calendar always fills the actual window. */
  body.is-wide { height:100%; overflow:hidden; }
  body.is-wide #app { max-width:none; width:100%; height:100vh; height:100dvh; margin:0; overflow:hidden; }
  body.is-wide .shell { flex-direction:row; min-height:0; height:100%; overflow:hidden; }

  .side-item.active .side-label { color:var(--ink); }

  body.is-wide header { padding:14px 28px 8px; flex-shrink:0; }
  body.is-wide header .header-actions { display:none; }
  body.is-wide .month-title { font-size:20px; }
  body.is-wide .legend, body.is-wide .select-bar { padding:0 28px 10px; flex-shrink:0; }
  body.is-wide .cal-wrap { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  body.is-wide .weekdays { flex-shrink:0; padding:0 28px; }
  body.is-wide .weekdays span { font-size:12.5px; }
  body.is-wide .grid { flex:1; min-height:0; display:grid; grid-auto-rows:1fr; gap:10px; padding:0 28px 20px; }
  body.is-wide .day-cell { min-height:0; height:100%; padding:10px 12px 8px; gap:5px; border-radius:14px; }
  body.is-wide .day-num { font-size:15px; }
  body.is-wide .ev-line { font-size:12.5px; height:23px; line-height:22px; border-radius:7px; padding:0 8px; }
  body.is-wide .more { font-size:12px; }
  body.is-wide .fab-row { position:static; padding:8px 28px 16px; flex-shrink:0; }
  body.is-wide .fab, body.is-wide .fab-undo, body.is-wide .fab-view { width:48px; height:48px; font-size:21px; }
  body.is-wide .view-opt { width:38px; height:38px; font-size:14px; }
  body.is-wide .sheet, body.is-wide .scrim.center .sheet { max-width:460px; }

  /* Transition douce ("pfitt") lors du changement de mois/semaine/jour,
     via swipe ou via les flèches. Un vrai glissement : l'ancien et le
     nouveau mois sont visibles en même temps et se déplacent ensemble,
     façon carrousel — pas un fondu séparé avec un trou entre les deux.
     N'anime que la carte du calendrier (transform, GPU) pour rester
     fluide même sur un téléphone modeste. */
  .cal-viewport { position:relative; overflow:hidden; touch-action:pan-y; }
  body.is-wide .cal-viewport { flex:1; min-height:0; display:flex; flex-direction:column; }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  /* ---------- Supabase ---------- */
  const SUPABASE_URL = 'https://dobozrtzmzbxfgpcjesq.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_65knnUG6E1RCT95lEW7apg_uta_GZnY';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true }
  });
  let rtChannel = null;

  const PALETTE = ['#3B6EA5','#E8735C','#3FA796','#C4547A','#D9A441','#6A5DAD'];
  const SHIFT_PRESETS = ['Matin','Soir','Soir rouge','DOM','Consultation','RH','RTT','CA','Formation','Réunion','Tutorat','Vacances nounou','Centre aéré'];

    'Soir rouge': { start:'11:00', end:'21:30' },
    'RH': { start:'', end:'' },
    'RTT': { start:'', end:'' },
    'CA': { start:'', end:'' },
    'Vacances nounou': { start:'', end:'' },
    'Consultation': { start:'08:00', end:'17:00' },
    'Formation': { start:'09:00', end:'17:00' },
    'Tutorat': { start:'09:00', end:'17:00' },
    'Réunion': { start:'09:00', end:'17:00' }
  };
  const ICON_CHOICES = ['','📌','🏠','🩺','🎓','🎉','🚗','🍽️','🛌','⭐','❤️'];
  const WEEKDAYS = ['L','M','M','J','V','S','D'];
  const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const MAX_LINES = 4;
  const VIEW_ICONS = { day:'J', week:'S', month:'M' };
  const VIEW_LABELS = { day:'Jour', week:'Semaine', month:'Mois' };

  let auth = { session: null, loading: true };
  let state = {
    profiles: [], household: null, myProfile: null, activeId: null,
    events: [], log: [], hidden: loadHidden(), _undo: null
  };
  let view = {
    year: new Date().getFullYear(), month: new Date().getMonth(),
    openDay: null, sheet: null, editingEvent: null,
    selectMode:false, selectedDays: [],
    mode:'month', weekAnchor: null, dayAnchor: null, viewMenuOpen:false,
    authMode:'signin', hhMode:'create', _authEmail:''
  };

  /* ---------- Local-only UI prefs (per device, doesn't need sync) ---------- */
  function loadHidden(){
    try { return JSON.parse(localStorage.getItem('af_hidden') || '[]'); } catch(e){ return []; }
  }
  function persistHidden(){
    try { localStorage.setItem('af_hidden', JSON.stringify(state.hidden)); } catch(e){}
  }

  function uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
      const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
      return v.toString(16);
    });
  }
  function activeProfile(){ return state.profiles.find(p=>p.id===state.activeId); }
  function profileById(id){ return state.profiles.find(p=>p.id===id); }

  /* ---------- Supabase data layer ---------- */
  async function afterLogin(){
    const { data: prof, error } = await sb.from('profiles').select('*').eq('user_id', auth.session.user.id).maybeSingle();
    if (error || !prof) { state.myProfile = null; state.household = null; return; }
    state.myProfile = prof;
    const { data: hh } = await sb.from('households').select('*').eq('id', prof.household_id).single();
    state.household = hh;
    await reloadHouseholdData();
    subscribeRealtime();
  }
  async function reloadHouseholdData(){
    if (!state.household) return;
    const hid = state.household.id;
    const [{ data: profiles }, { data: events }, { data: log }] = await Promise.all([
      sb.from('profiles').select('*').eq('household_id', hid),
      sb.from('events').select('*, event_participants(profile_id)').eq('household_id', hid),
      sb.from('activity_log').select('*').eq('household_id', hid).order('ts', { ascending:false }).limit(200)
    ]);
    state.profiles = profiles || [];
    state.events = (events || []).map(e=>({
      id: e.id, title: e.title, date: e.date,
      start: e.start_time || '', end: e.end_time || '', icon: e.icon || '',
      participants: (e.event_participants || []).map(p=>p.profile_id)
    }));
    state.log = (log || []).map(l=>({ id: l.id, who: l.who, action: l.action, ts: new Date(l.ts).getTime() }));
    state.activeId = state.myProfile ? state.myProfile.id : null;
  }
  function subscribeRealtime(){
    if (rtChannel) { try { sb.removeChannel(rtChannel); } catch(e){} rtChannel = null; }
    if (!state.household) return;
    const hid = state.household.id;
    let t = null;
    const onChange = ()=>{
      clearTimeout(t);
      t = setTimeout(async ()=>{ await reloadHouseholdData(); render(); }, 200);
    };
    rtChannel = sb.channel('household-'+hid)
      .on('postgres_changes', { event:'*', schema:'public', table:'events', filter:'household_id=eq.'+hid }, onChange)
      .on('postgres_changes', { event:'*', schema:'public', table:'event_participants' }, onChange)
      .on('postgres_changes', { event:'*', schema:'public', table:'profiles', filter:'household_id=eq.'+hid }, onChange)
      .on('postgres_changes', { event:'*', schema:'public', table:'activity_log', filter:'household_id=eq.'+hid }, onChange)
      .subscribe();
  }
  async function logActivity(action){
    if (!state.household || !state.myProfile) return;
    try { await sb.from('activity_log').insert({ household_id: state.household.id, who: state.myProfile.name, action }); } catch(e){}
  }
  async function upsertEventDb(ev){
    const { error } = await sb.from('events').upsert({
      id: ev.id, household_id: state.household.id, title: ev.title, date: ev.date,
      start_time: ev.start || null, end_time: ev.end || null, icon: ev.icon || null,
      created_by: state.myProfile.id
    });
    if (error) throw error;
    await sb.from('event_participants').delete().eq('event_id', ev.id);
    if (ev.participants.length) {
      const { error: perr } = await sb.from('event_participants').insert(ev.participants.map(pid=>({ event_id: ev.id, profile_id: pid })));
      if (perr) throw perr;
    }
  }
  async function deleteEventDb(id){
    const { error } = await sb.from('events').delete().eq('id', id);
    if (error) throw error;
  }
  async function createHousehold(name, color){
    const { data: hh, error } = await sb.from('households').insert({}).select().single();
    if (error) throw error;
    const { data: prof, error: perr } = await sb.from('profiles').insert({ user_id: auth.session.user.id, household_id: hh.id, name, color }).select().single();
    if (perr) throw perr;
    state.household = hh; state.myProfile = prof;
    await reloadHouseholdData();
    subscribeRealtime();
    await logActivity('a créé le foyer');
    await reloadHouseholdData();
    render();
  }
  async function joinHousehold(code, name, color){
    const { data: hh, error } = await sb.from('households').select('*').eq('invite_code', code).maybeSingle();
    if (error) throw error;
    if (!hh) throw new Error("Code d'invitation introuvable.");
    const { data: prof, error: perr } = await sb.from('profiles').insert({ user_id: auth.session.user.id, household_id: hh.id, name, color }).select().single();
    if (perr) throw perr;
    state.household = hh; state.myProfile = prof;
    await reloadHouseholdData();
    subscribeRealtime();
    await logActivity('a rejoint le foyer');
    await reloadHouseholdData();
    render();
  }
  async function createGuestProfile(name, color){
    // Profil "invité" : pas de compte, pas d'email, juste une entrée dans
    // le foyer (utile pour les enfants) qu'on peut ajouter aux événements
    // comme n'importe quel autre membre.
    const { error } = await sb.from('profiles').insert({ household_id: state.household.id, name, color });
    if (error) throw error;
    await logActivity(`a ajouté le profil « ${name} »`);
    await reloadHouseholdData();
  }
  async function deleteGuestProfile(profile){
    const { error } = await sb.from('profiles').delete().eq('id', profile.id);
    if (error) throw error;
    await logActivity(`a supprimé le profil « ${profile.name} »`);
    await reloadHouseholdData();
  }

  function snapshot(){
    state._undo = { events: JSON.parse(JSON.stringify(state.events)), log: JSON.parse(JSON.stringify(state.log)) };
  }
  async function undo(){
    if (!state._undo) return;
    const prevEvents = state._undo.events;
    const curEvents = state.events;
    const prevIds = new Set(prevEvents.map(e=>e.id));
    const toDelete = curEvents.filter(e=>!prevIds.has(e.id));
    const toRestore = prevEvents.filter(e=>{
      const cur = curEvents.find(c=>c.id===e.id);
      return !cur || JSON.stringify(cur)!==JSON.stringify(e);
    });
    state._undo = null;
    try {
      for (const e of toDelete) await deleteEventDb(e.id);
      for (const e of toRestore) await upsertEventDb(e);
      await logActivity('a annulé la dernière action');
      await reloadHouseholdData();
    } catch(e){}
    render();
  }
  function fmtTime(ts){
    const d = new Date(ts);
    return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) + ' à ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  }
  function dstr(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
  function stripeBg(colors){
    if (!colors.length) colors=['#999'];
    if (colors.length===1) return colors[0];
    const n = colors.length, step = 100/n, stops=[];
    colors.forEach((c,i)=>{ stops.push(`${c} ${(i*step).toFixed(2)}%`, `${c} ${((i+1)*step).toFixed(2)}%`); });
    return `linear-gradient(135deg, ${stops.join(', ')})`;
  }
  function pastelStripeBg(colors){
    if (!colors.length) colors=['#999'];
    const tinted = colors.map(c=>`color-mix(in srgb, ${c} 22%, var(--surface))`);
    if (tinted.length===1) return tinted[0];
    const n = tinted.length, step = 100/n, stops=[];
    tinted.forEach((c,i)=>{ stops.push(`${c} ${(i*step).toFixed(2)}%`, `${c} ${((i+1)*step).toFixed(2)}%`); });
    return `linear-gradient(135deg, ${stops.join(', ')})`;
  }
  function todayStr(){ const t=new Date(); return dstr(t.getFullYear(),t.getMonth(),t.getDate()); }
  function isWide(){ return document.body.classList.contains('is-wide'); }

  function render(){
    const root = document.getElementById('app');
    root.innerHTML = '';
    if (auth.loading) { root.appendChild(renderLoading()); return; }
    if (!auth.session) { root.appendChild(renderAuthScreen()); return; }
    if (!state.myProfile) { root.appendChild(renderHouseholdSetup()); return; }
    const shell = document.createElement('div'); shell.className='shell';
    shell.appendChild(renderSidebar());
    const main = document.createElement('div'); main.className='main-col';
    main.appendChild(renderHeader());
    main.appendChild(renderLegend());
    const viewport = document.createElement('div'); viewport.className='cal-viewport';
    const calEl = renderCalendar();
    attachSwipeNav(calEl);
    viewport.appendChild(calEl);
    main.appendChild(viewport);
    main.appendChild(renderFabRow());
    shell.appendChild(main);
    root.appendChild(shell);
    if (view.sheet==='day') root.appendChild(renderDaySheet());
    if (view.sheet==='form') root.appendChild(renderEventForm());
    if (view.sheet==='log') root.appendChild(renderLogSheet());
    if (view.sheet==='switch') root.appendChild(renderSwitchSheet());
    if (view.sheet==='search') root.appendChild(renderSearchSheet());
    initMarquees();
  }

  function initMarquees(){
    requestAnimationFrame(()=>{
      document.querySelectorAll('.ev-line').forEach(line=>{
        const text = line.querySelector('.ev-line-text');
        if (!text) return;
        const overflow = text.scrollWidth - line.clientWidth;
        if (overflow > 2) {
          const dist = -(overflow + 4);
          line.style.setProperty('--marquee-dist', dist + 'px');
          const dur = Math.max(3.5, Math.abs(dist) / 16);
          line.style.setProperty('--marquee-dur', dur + 's');
          line.classList.add('marquee');
        } else {
          line.classList.remove('marquee');
        }
      });
    });
  }

  /* ---------- Header ---------- */
  function headerLabel(){
    if (view.mode==='week') {
      const mon = mondayOf(view.weekAnchor || todayStr());
      const sun = new Date(mon); sun.setDate(mon.getDate()+6);
      const fmt = (d)=> d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0,3);
      return `${fmt(mon)} – ${fmt(sun)}`;
    }
    if (view.mode==='day') {
      const d = new Date((view.dayAnchor||todayStr())+'T00:00:00');
      return d.toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long'});
    }
    return `${MONTHS[view.month]} ${view.year}`;
  }
  function stepPrev(){
    if (view.mode==='week') { view.weekAnchor = addDays(view.weekAnchor||todayStr(), -7); }
    else if (view.mode==='day') { view.dayAnchor = addDays(view.dayAnchor||todayStr(), -1); }
    else { view.month--; if(view.month<0){view.month=11; view.year--;} }
  }
  function stepNext(){
    if (view.mode==='week') { view.weekAnchor = addDays(view.weekAnchor||todayStr(), 7); }
    else if (view.mode==='day') { view.dayAnchor = addDays(view.dayAnchor||todayStr(), 1); }
    else { view.month++; if(view.month>11){view.month=0; view.year++;} }
  }
  function navPrev(){ stepPrev(); renderWithTransition('prev'); }
  function navNext(){ stepNext(); renderWithTransition('next'); }
  /* Anime le changement de vue avec un vrai glissement "carrousel" :
     l'ancien et le nouveau mois sont tous les deux dans le DOM en même
     temps, côte à côte, et se déplacent ensemble — pas un fondu qui
     laisse un trou vide entre les deux. Seule la carte du calendrier
     bouge (transform, GPU), le reste de la page (en-tête, légende) se
     met à jour instantanément à côté, sans animer. */
  let navBusy = false;
  function renderWithTransition(dir){
    const viewport = document.querySelector('.cal-viewport');
    const oldEl = viewport ? viewport.querySelector('.cal-wrap') : null;
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!viewport || !oldEl || reduceMotion || navBusy) { render(); return; }
    navBusy = true;

    // En-tête et légende changent tout de suite (libellé du mois, etc.),
    // seule la zone du calendrier est animée.
    const oldHeader = document.querySelector('header');
    if (oldHeader) oldHeader.replaceWith(renderHeader());
    const oldLegend = document.querySelector('.legend, .select-bar');
    if (oldLegend) oldLegend.replaceWith(renderLegend());

    const newEl = renderCalendar();
    attachSwipeNav(newEl);
    const goingNext = dir === 'next';

    // Mesurer la hauteur AVANT de passer les éléments en position absolue
    // (sinon le conteneur s'effondre à 0 dès que son seul enfant en flux
    // normal en sort, et on mesurerait une hauteur déjà nulle).
    viewport.style.minHeight = viewport.offsetHeight + 'px';

    [oldEl, newEl].forEach(el=>{
      el.style.position = 'absolute';
      el.style.top = '0'; el.style.left = '0'; el.style.width = '100%';
    });
    newEl.style.transform = `translateX(${goingNext ? '100%' : '-100%'})`;
    viewport.appendChild(newEl);
    initMarquees();

    void newEl.offsetWidth; // force le navigateur à appliquer l'état de départ avant d'animer

    const dur = '.22s'; const ease = 'cubic-bezier(.22,.61,.36,1)';
    oldEl.style.transition = `transform ${dur} ${ease}`;
    newEl.style.transition = `transform ${dur} ${ease}`;
    requestAnimationFrame(()=>{
      oldEl.style.transform = `translateX(${goingNext ? '-100%' : '100%'})`;
      newEl.style.transform = 'translateX(0)';
    });

    let cleaned = false;
    const cleanup = ()=>{
      if (cleaned) return; cleaned = true;
      oldEl.remove();
      newEl.style.position = ''; newEl.style.top = ''; newEl.style.left = ''; newEl.style.width = '';
      newEl.style.transform = ''; newEl.style.transition = '';
      viewport.style.minHeight = '';
      navBusy = false;
    };
    newEl.addEventListener('transitionend', cleanup, { once:true });
    setTimeout(cleanup, 320); // filet de sécurité si transitionend ne se déclenche pas
  }
  function renderHeader(){
    const h = document.createElement('header');
    const p = activeProfile();
    h.innerHTML = `
      <div class="month-nav">
        <button id="prev-m" aria-label="Précédent">←</button>
        <div class="month-title" style="text-transform:capitalize">${headerLabel()}</div>
        <button id="next-m" aria-label="Suivant">→</button>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="go-today" aria-label="Aujourd'hui" style="font-size:13px;">📍</button>
        <button class="icon-btn" id="open-search" aria-label="Rechercher">🔍</button>
        <button class="icon-btn${view.selectMode?' active':''}" id="toggle-select" aria-label="Sélection multiple">${view.selectMode?'✕':'☑'}</button>
        <button class="avatar" id="open-switch" style="background:${p.color}">${p.name[0].toUpperCase()}</button>
      </div>
    `;
    h.querySelector('#go-today').onclick=()=>{
      const t = new Date();
      view.year = t.getFullYear(); view.month = t.getMonth();
      view.weekAnchor = todayStr(); view.dayAnchor = todayStr();
      render();
    };
    h.querySelector('#open-search').onclick=()=>{ view.sheet='search'; render(); };
    h.querySelector('#prev-m').onclick=navPrev;
    h.querySelector('#next-m').onclick=navNext;
    h.querySelector('#toggle-select').onclick=()=>{ view.selectMode = !view.selectMode; view.selectedDays=[]; render(); };
    h.querySelector('#open-switch').onclick=()=>{ view.sheet='switch'; render(); };
    return h;
  }

  /* ---------- Legend / select bar ---------- */
  function renderLegend(){
    if (view.selectMode) {
      const bar = document.createElement('div');
      bar.className='select-bar';
      const n = view.selectedDays.length;
      bar.innerHTML = `<span>${n ? n+' jour'+(n>1?'s':'')+' sélectionné'+(n>1?'s':'') : 'Touchez des jours à sélectionner'}</span>`;

        clearBtn.onclick = ()=>{ view.selectedDays=[]; render(); };
        bar.appendChild(clearBtn);
      }
      return bar;
    }
    const wrap = document.createElement('div');
    wrap.className='legend';
    state.profiles.forEach(p=>{
      const off = state.hidden.includes(p.id);

      chip.className='legend-chip' + (off?' off':'');

  /* ---------- Calendar ---------- */
  function eventsFor(dateStr){
    return state.events.filter(e=>e.date===dateStr && e.participants.some(id=>!state.hidden.includes(id)));
  }
  function addDays(dateStr, n){
    const d = new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()+n);
    return dstr(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function mondayOf(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    const offset = (d.getDay()+6)%7;
    d.setDate(d.getDate()-offset);
    return d;
  }
  function buildDayCell(ds, otherMonth, maxLines){
    const todayS = todayStr();
    const picked = view.selectedDays.includes(ds);
    const cell = document.createElement('div');
    cell.className = 'day-cell' + (otherMonth?' other-month':'') + (ds===todayS?' today':'') + (picked?' picked':'');
    const evs = eventsFor(ds);
    let linesHtml = '';
    evs.slice(0,maxLines).forEach(e=>{
      const cols = e.participants.filter(id=>!state.hidden.includes(id)).map(id=>{ const pr=profileById(id); return pr?pr.color:'#999'; });
      linesHtml += `<div class="ev-line" style="background:${pastelStripeBg(cols)};border-color:${cols[0]||'#999'}"><span class="ev-line-text">${e.icon?e.icon+' ':''}${e.start?escapeHtml(e.start)+' · ':''}${escapeHtml(e.title)}</span></div>`;
    });
    const dnum = Number(ds.slice(8,10));
    cell.innerHTML = `<div class="day-num">${dnum}</div>${linesHtml}${evs.length>maxLines?`<div class="more">+${evs.length-maxLines} autre${evs.length-maxLines>1?'s':''}</div>`:''}${picked?'<div class="pick-mark">✓</div>':''}`;
    cell.onclick = ()=>{
      if (view.selectMode) {
        if (picked) view.selectedDays = view.selectedDays.filter(x=>x!==ds);
        else view.selectedDays.push(ds);
        render();
        return;
      }
      if (!evs.length) { openEventForm(null, ds); return; }
      view.openDay = ds; view.sheet='day'; render();
    };
    return cell;
  }

  function renderCalendar(){
    if (view.mode==='week') return renderWeekView();
    if (view.mode==='day') return renderDayView();
    return renderMonthView();
  }

  /* Swipe tactile gauche/droite pour naviguer entre mois/semaines/jours :
     la carte suit le doigt en direct (comme Google Agenda) — l'ancien et
     le nouveau mois sont visibles et bougent ensemble pendant tout le
     geste, sans coupure ni animation "boîte noire" qui ne démarre qu'au
     relâchement. On exige un mouvement nettement plus horizontal que
     vertical avant de capturer le geste, pour ne pas gêner le défilement
     vertical normal de la page. */
  function buildNeighborCard(dir){
    // Construit la carte du mois/semaine/jour précédent (dir<0) ou suivant
    // (dir>0) sans toucher à l'affichage courant : on avance/recule
    // temporairement la vue, on rend la carte, puis on remet la vue en
    // place.
    if (dir < 0) stepPrev(); else stepNext();
    const el = renderCalendar();
    if (dir < 0) stepNext(); else stepPrev();
    return el;
  }
  function attachSwipeNav(el){
    let startX = 0, startY = 0, startT = 0;
    let tracking = false;  // un doigt est posé, direction pas encore tranchée
    let dragging = false;  // geste capturé comme un swipe horizontal
    let viewport = null, curEl = null, prevCard = null, nextCard = null, width = 1;

    function cleanup(){
      if (prevCard) { prevCard.remove(); prevCard = null; }
      if (nextCard) { nextCard.remove(); nextCard = null; }
      if (curEl) {
        curEl.style.position = ''; curEl.style.top = ''; curEl.style.left = ''; curEl.style.width = '';
        curEl.style.transform = ''; curEl.style.transition = '';
      }
      if (viewport) viewport.style.minHeight = '';
      viewport = curEl = null;
    }

    el.addEventListener('touchstart', (e)=>{
      if (e.touches.length !== 1 || navBusy) { tracking = false; return; }
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      startT = Date.now();
      tracking = true;
      dragging = false;
    }, { passive:true });

    el.addEventListener('touchmove', (e)=>{
      if (!tracking) return;
      const t = e.touches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;
      if (!dragging) {
        if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return; // pas encore assez de mouvement
        if (Math.abs(dx) < Math.abs(dy) * 1.2) { tracking = false; return; } // plutôt un scroll vertical, on laisse faire
        dragging = true;
        viewport = document.querySelector('.cal-viewport');
        curEl = viewport ? viewport.querySelector('.cal-wrap') : null;
        if (!viewport || !curEl) { tracking = false; dragging = false; return; }
        width = viewport.offsetWidth || 1;
        viewport.style.minHeight = viewport.offsetHeight + 'px';
        curEl.style.position = 'absolute'; curEl.style.top = '0'; curEl.style.left = '0'; curEl.style.width = '100%';
        curEl.style.transition = 'none';
        prevCard = buildNeighborCard(-1);
        nextCard = buildNeighborCard(1);
        [prevCard, nextCard].forEach(c=>{
          c.style.position = 'absolute'; c.style.top = '0'; c.style.left = '0'; c.style.width = '100%'; c.style.transition = 'none';
        });
        prevCard.style.transform = 'translateX(-100%)';
        nextCard.style.transform = 'translateX(100%)';
        viewport.appendChild(prevCard);
        viewport.appendChild(nextCard);
        initMarquees();
      }
      if (!dragging) return;
      e.preventDefault(); // on a le geste : plus de scroll vertical pendant le glissement
      curEl.style.transform = `translateX(${dx}px)`;
      prevCard.style.transform = `translateX(calc(-100% + ${dx}px))`;
      nextCard.style.transform = `translateX(calc(100% + ${dx}px))`;
    }, { passive:false });

    function settle(e){
      if (!tracking) return;
      tracking = false;
      if (!dragging) return;
      dragging = false;
      const touch = (e.changedTouches && e.changedTouches[0]) || null;
      const dx = touch ? touch.clientX - startX : 0;
      const dt = Math.max(1, Date.now() - startT);
      const speed = Math.abs(dx) / dt; // px/ms
      const goingPrev = dx > 0;
      // On termine le changement de page si le glissement est assez ample,
      // ou assez rapide (un petit coup sec compte aussi, pas seulement une
      // grande amplitude).
      const complete = Math.abs(dx) > width * 0.32 || speed > 0.55;
      const dur = '.22s'; const ease = 'cubic-bezier(.22,.61,.36,1)';
      [curEl, prevCard, nextCard].forEach(x=>{ x.style.transition = `transform ${dur} ${ease}`; });
      if (complete) {
        curEl.style.transform = `translateX(${goingPrev ? '100%' : '-100%'})`;
        (goingPrev ? prevCard : nextCard).style.transform = 'translateX(0)';
      } else {
        curEl.style.transform = 'translateX(0)';
        prevCard.style.transform = 'translateX(-100%)';
        nextCard.style.transform = 'translateX(100%)';
      }
      navBusy = true;
      let done = false;
      const finish = ()=>{
        if (done) return; done = true;
        navBusy = false;
        if (complete) {
          if (goingPrev) stepPrev(); else stepNext();
          render();
        } else {
          cleanup();
        }
      };
      curEl.addEventListener('transitionend', finish, { once:true });
      setTimeout(finish, 320); // filet de sécurité si transitionend ne se déclenche pas
    }

    el.addEventListener('touchend', settle, { passive:true });
    el.addEventListener('touchcancel', settle, { passive:true });
  }

  function renderMonthView(){
    const wrap = document.createElement('div');
    wrap.className='cal-wrap';
    const wd = document.createElement('div'); wd.className='weekdays';
    WEEKDAYS.forEach(w=>{ const s=document.createElement('span'); s.textContent=w; wd.appendChild(s); });
    wrap.appendChild(wd);

    const grid = document.createElement('div'); grid.className='grid';
    const first = new Date(view.year, view.month, 1);
    let startOffset = (first.getDay()+6)%7;
    const daysInMonth = new Date(view.year, view.month+1, 0).getDate();
    const prevDays = new Date(view.year, view.month, 0).getDate();

    const cells = [];
    for (let i=startOffset; i>0; i--) cells.push({ d: prevDays-i+1, other:true, m: view.month-1 });
    for (let d=1; d<=daysInMonth; d++) cells.push({ d, other:false, m: view.month });
    while (cells.length % 7 !== 0 || cells.length < 35) cells.push({ d: cells.length - (startOffset+daysInMonth) + 1, other:true, m: view.month+1 });

    cells.forEach(c=>{
      let y=view.year, m=c.m;
      if (m<0){ m=11; y--; } else if (m>11){ m=0; y++; }
      const ds = dstr(y,m,c.d);
      grid.appendChild(buildDayCell(ds, c.other, isWide() ? 8 : MAX_LINES));
    });
    wrap.appendChild(grid);
    return wrap;
  }

  /* ---------- Custom time wheel picker ---------- */
  const WHEEL_HOURS = Array.from({length:24},(_,i)=>i);
  const WHEEL_MINUTES = [0,5,10,15,20,25,30,35,40,45,50,55];
  const WHEEL_ITEM_H = 44;

  const WHEEL_REPEAT = 9;
  function wheelOpacity(col, idx){
    [...col.children].forEach((el,i)=>{ el.style.opacity = i===idx?'1':'.35'; });
  }
  function fillWheelCol(col, values, selIdx, onSettle){
    const n = values.length;
    const mid = Math.floor(WHEEL_REPEAT/2);
    let html = '';
    for (let r=0; r<WHEEL_REPEAT; r++){
      values.forEach(v=>{ html += `<div class="wheel-item">${String(v).padStart(2,'0')}</div>`; });
    }
    col.innerHTML = html;
    const total = n*WHEEL_REPEAT;
    let curIdx = mid*n + selIdx;
    col.scrollTop = curIdx * WHEEL_ITEM_H;
    wheelOpacity(col, curIdx);
    let t=null;
    col.addEventListener('scroll', ()=>{
      if (t) clearTimeout(t);
      t = setTimeout(()=>{
        let idx = Math.round(col.scrollTop / WHEEL_ITEM_H);
        idx = Math.max(0, Math.min(total-1, idx));
        if (col.scrollTop !== idx*WHEEL_ITEM_H) col.scrollTo({top: idx*WHEEL_ITEM_H, behavior:'smooth'});
        wheelOpacity(col, idx);
        const realVal = values[((idx % n)+n)%n];
        onSettle(realVal);
        if (idx < n*1.5 || idx > total - n*1.5) {
          setTimeout(()=>{
            const newIdx = mid*n + (((idx % n)+n)%n);
            col.scrollTop = newIdx * WHEEL_ITEM_H;
            wheelOpacity(col, newIdx);
          }, 260);
        }
      }, 130);
    });
  }

  function openTimeWheel(currentValue, onConfirm){
    let h = 8, m = 0;
    if (currentValue) {
      const parts = currentValue.split(':');
      h = parseInt(parts[0],10) || 0;
      m = Math.round((parseInt(parts[1],10)||0)/5)*5;
      if (m>55) m=55;
    }
    let curH = h, curM = m;
    const hIdx = WHEEL_HOURS.indexOf(h);
    const mIdx = WHEEL_MINUTES.indexOf(m);

    const scrim = document.createElement('div'); scrim.className='scrim center'; scrim.style.zIndex='30';
    const sheet = document.createElement('div'); sheet.className='sheet';
    sheet.innerHTML = `
      <div class="sheet-header"><h2>Choisir l'heure</h2><button class="sheet-close" id="wp-close">✕</button></div>
      <div class="wheel-frame">
        <div class="wheel-highlight"></div>
        <div class="wheel-picker">
          <div class="wheel-col" id="wp-hour"></div>
          <div class="wheel-colon">:</div>
          <div class="wheel-col" id="wp-min"></div>
        </div>
      </div>
      <button class="ghost-btn" id="wp-clear">Aucune heure</button>
      <button class="save-btn" id="wp-set">Définir</button>
    `;
    fillWheelCol(sheet.querySelector('#wp-hour'), WHEEL_HOURS, hIdx, (v)=>{ curH=v; });
    fillWheelCol(sheet.querySelector('#wp-min'), WHEEL_MINUTES, mIdx, (v)=>{ curM=v; });
    sheet.querySelector('#wp-close').onclick = ()=>scrim.remove();
    sheet.querySelector('#wp-clear').onclick = ()=>{ onConfirm(''); scrim.remove(); };
    sheet.querySelector('#wp-set').onclick = ()=>{
      onConfirm(`${String(curH).padStart(2,'0')}:${String(curM).padStart(2,'0')}`);
      scrim.remove();
    };
    scrim.onclick = (e)=>{ if(e.target===scrim) scrim.remove(); };
    scrim.appendChild(sheet);
    document.body.appendChild(scrim);
  }

  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }

  function updateLayout(){
    // Width-based, not aspect-based: a real browser window gets the
    // full desktop layout whether it's wide-short or narrow-tall.
    // Only re-render when the wide/narrow classification actually
    // changes — a height-only resize (e.g. a mobile virtual keyboard
    // opening) must NOT re-render, or it wipes the DOM and steals
    // focus from whatever field the person just tapped.
    const wide = window.innerWidth >= 780;
    const changed = document.body.classList.contains('is-wide') !== wide;
    document.body.classList.toggle('is-wide', wide);
    if (changed) render();
  }
  let layoutTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(layoutTimer);
    layoutTimer = setTimeout(updateLayout, 120);
  });
  window.addEventListener('orientationchange', updateLayout);
  document.body.classList.toggle('is-wide', window.innerWidth >= 780);

  /* ---------- Boot ---------- */
  async function boot(){
    render();
    const { data: { session } } = await sb.auth.getSession();
    auth.session = session; auth.loading = false;
    if (session) { try { await afterLogin(); } catch(e){} }
    render();
    sb.auth.onAuthStateChange((event, session)=>{
      const hadSession = !!auth.session, hasSession = !!session;
      auth.session = session;
      if (!hadSession && !hasSession) return; // no real change (e.g. redundant initial fire) — don't steal focus with a needless re-render
      if (session) {
        afterLogin().then(render).catch(()=>render());
      } else {
        if (rtChannel) { try { sb.removeChannel(rtChannel); } catch(e){} rtChannel = null; }
        state.household = null; state.myProfile = null; state.profiles = []; state.events = []; state.log = [];
        render();
      }
    });
  }
  boot();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
